const nav=$('nav');cats.forEach(c=>{let b=document.createElement('button');b.className='tab';b.type='button';b.textContent=c;b.dataset.category=c;b.setAttribute('aria-pressed',c===category?'true':'false');b.addEventListener('click',()=>{category=c;visible=24;nav.querySelectorAll('button').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));render();});nav.appendChild(b);});
function urls(rec){return rec.sources.map(id=>S[id]).filter(Boolean).map(x=>`<a target="_blank" rel="noopener noreferrer" title="${esc(x.name)}；${esc(x.note)}" href="${esc(x.url)}">${esc(x.name.replace('極限攻略｜','').replace('巴哈姆特｜','巴哈：').replace('GameFAQs｜','FAQ：').slice(0,34))} ↗</a>`).join(' · ')}
function card(x){let steps=x.steps||[],isCode=x.section==='金手指',details=steps.length&&!isCode?`<details><summary>查看流程／重點</summary><ol>${steps.map(y=>`<li>${esc(y)}</li>`).join('')}</ol></details>`:'',code=isCode?`<div><button type="button" class="copy" data-copy="${esc(x.id)}">複製代碼</button><pre class="codebox">${esc(steps.join('\n'))}</pre></div>`:'';return `<article class="item"><div class="pre"><span class="cat">${esc(x.section)}</span><span class="stage">${esc(x.stage)}</span></div><h3>${esc(x.title)}</h3><div class="ja" lang="ja">${esc(x.ja)}</div><p class="summary">${esc(x.summary)}</p>${x.risk&&x.section!=='迷宮'&&x.section!=='地圖'?`<div class="risk">⚑ ${esc(x.risk)}</div>`:''}${details}${code}<div class="src">${urls(x)}</div>${x.section==='迷宮'||x.section==='地圖'?'':`<div class="footnote">${esc(x.quality)}</div>`}</article>`}
function sources(){const q=norm(query.trim());let ss=DATA.sources.filter(s=>!q||norm([s.name,s.kind,s.note,s.url,s.id].join(' ')).includes(q));$('sourceCards').innerHTML=ss.map(s=>`<article class="source"><span class="badge">${esc(s.kind)}</span><strong>${esc(s.name)}</strong><p>${esc(s.note)}</p><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)} ↗</a></article>`).join('')||'<p class="empty">沒有符合的來源。</p>';$('resultCount').textContent=`找到 ${ss.length} 個來源／共 ${DATA.sources.length} 個`}
function render(){document.body.classList.toggle('view-sources',category==='來源');$('moreWrap').hidden=true;if(category==='來源'){sources();return}let q=norm(query.trim()),rs=R.filter(x=>(category==='全部'||x.section===category)&&(!q||norm([x.title,x.ja,x.summary,x.stage,x.risk,x.tags.join(' '),x.steps.join(' ')].join(' ')).includes(q)));$('cards').innerHTML=rs.length?rs.slice(0,visible).map(card).join(''):'<div class="empty">查不到符合條件的攻略。可以改用日文原名、事件地名或其他關鍵字。</div>';$('resultCount').textContent=`找到 ${rs.length} 筆／共 ${R.length} 筆攻略資料`;$('moreWrap').hidden=rs.length<=visible;$('loadMore').textContent=`再顯示 ${Math.min(24,Math.max(0,rs.length-visible))} 筆（尚有 ${Math.max(0,rs.length-visible)} 筆）`}
$('cards').addEventListener('click',e=>{let b=e.target.closest('[data-copy]');if(!b)return;const x=R.find(x=>x.id===b.dataset.copy);if(!x)return;const value=x.steps.join('\n');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(()=>{b.textContent='已複製';setTimeout(()=>b.textContent='複製代碼',1300)}).catch(()=>legacy(value,b))}else legacy(value,b)});function legacy(t,b){let a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.top='-1000px';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();b.textContent=ok?'已複製':'請長按選取';setTimeout(()=>b.textContent='複製代碼',1500)}
$('search').addEventListener('input',e=>{query=e.target.value;visible=24;render()});$('loadMore').addEventListener('click',()=>{visible+=24;render()});$('dataVersion').textContent='v '+DATA.version.replace('-ps2-research-preview','');$('offlineMode').textContent=navigator.onLine?'':' · 離線';render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
