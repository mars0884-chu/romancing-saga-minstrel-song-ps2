"><style>
:root{color-scheme:light;--ink:#33252b;--wine:#75273d;--line:#e6d5d0}
*{box-sizing:border-box}html,body{margin:0;font:16px/1.65 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#faf6f3;color:var(--ink)}body{overflow-x:auto}
header{background:#532337;color:white;padding:16px 20px}header .brand{max-width:1100px;margin:auto;display:flex;align-items:center;gap:17px;flex-wrap:wrap}header img{width:83px;height:83px;object-fit:cover;border-radius:8px}h1{font-size:clamp(18px,3.2vw,28px);line-height:1.4;margin:0}header small{display:block;color:#e5cfcb}
main{max-width:1100px;padding:18px;margin:auto}.note{padding:12px 15px;background:white;border:1px solid var(--line);border-left:4px solid var(--wine);border-radius:7px;margin-bottom:14px;font-size:14px}.controls{position:sticky;top:0;padding:12px 0;background:#faf6f3;z-index:3;border-bottom:1px solid var(--line)}
input{width:100%;height:48px;background:white;border:1px solid #bba9a7;border-radius:9px;padding:10px 12px;font-size:16px}.tabs{display:flex;overflow-x:auto;gap:7px;padding:10px 0}.tab{border:1px solid #d6c3bd;background:white;color:#672638;padding:7px 12px;border-radius:18px;white-space:nowrap;font:inherit;font-size:14px;cursor:pointer}.tab[aria-pressed="true"]{background:var(--wine);color:white}.count{color:#6d5f60;font-size:13px;margin:9px 0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-width:0;background:white;border:1px solid var(--line);padding:15px;border-radius:10px;overflow-wrap:anywhere}.card h2{font-size:19px;margin:0}.ja{color:#794357;font-size:13px}.meta{font-size:12px;color:#72575f;margin:9px 0}.summary{margin:10px 0}.steps{font-size:14px;line-height:1.75;padding-left:22px}.steps li{margin:6px 0}.markers{border-top:1px solid #d6b7bd;margin-top:16px;padding-top:10px}.markers h3,.chapters h3{font-size:16px;color:var(--wine)}.marker{display:grid;grid-template-columns:60px minmax(70px,90px) 1fr;gap:7px;padding:8px 0;border-bottom:1px solid #f0e9e6;font-size:13px}.chapter{padding:11px;border:1px solid #eee0db;margin:10px 0;border-radius:8px}.chapter b{display:block;color:#4e2834}.chapter p{font-size:13px;margin:5px 0}.chip{background:#f7e9eb;color:#642438;border:1px solid #e5cfd3;border-radius:12px;margin:3px 5px 3px 0;padding:5px 8px;display:inline-block;cursor:pointer}.source{font-size:11px;color:#7c6470;margin:8px 0}footer{font-size:12px;color:#6e6065;margin:25px 0 50px}.load{margin:16px auto;display:block;padding:10px 20px;border:1px solid var(--wine);border-radius:8px;color:var(--wine);background:#fff}
@media(max-width:700px){.cards{grid-template-columns:1fr}.card{padding:13px}.marker{grid-template-columns:52px 69px minmax(0,1fr)}}@media print{.controls,.tabs,.load{display:none}.cards{display:block}.card{break-inside:avoid;margin:10px 0}}

；明確排除 2022 新機制"},{"id":"BEGIN-002","section":"新手","title":"進城先找酒館與固定NPC","ja":"PUB／吟遊詩人／街の住人","summary":"地圖上還沒出現的城市、洞窟，常要透過對話得知；只知道名稱也不保證位置已開啟。","steps":["每抵達新城鎮，先查看 PUB／酒館，再與固定站著的居民交談。","開出新地點後，回世界地圖檢查移動路線。","暫時找不到下一座城市時，可加入認識其他地區的主角型同伴。"],"sources":["PS2-BEG-PLAY","FAQ-GRAY"],"tags":["PS2原版","新手注意事項","探索"],"stage":"探索","risk":"別以為沒有事件標記就代表沒有新任務。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-003","section":"新手","title":"玩家筆記是任務追蹤工具","ja":"プレイヤーノート","summary":"原版不是接任務就自動導航，請靠玩家筆記確認觸發與解決情況。","steps":["每接到一條委託就打開 Player Note 確認有沒有寫入。","回報任務後再次確認是否記錄完成。","未寫清楚的線索要回頭問 NPC，不要只看世界地圖。"],"sources":["PS2-BEG-PLAY"],"tags":["PS2原版","新手注意事項","任務基礎"],"stage":"任務基礎","risk":"PS2 原版不提供現代式逐步導航。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-004","section":"新手","title":"任務進度不等於角色等級","ja":"シナリオ進行度／イベントランク","summary":"2005 原版用隱藏事件進度調整任務，戰鬥勝利會推進事件；介面不顯示百分比。","steps":["不要照普通 RPG 的方式在新手村一直刷怪再接支線。","先解正在有效期間的低進度事件；戰鬥數多不代表比較安全。","參考ギユウ軍的新對話間接估計進度，不要套用 Remastered 的進度顯示。"],"sources":["PS2-BEG-PLAY","PS2-ORIGINAL-FAQ-2008","PS2-BEG-REM-VS"],"tags":["PS2原版","新手注意事項","重要機制"],"stage":"重要機制","risk":"本站任務百分比是攻略研究用估算，PS2 遊戲內沒有進度百分比。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-005","section":"新手","title":"第一批容易錯過：開拓村誘拐","ja":"開拓村の誘拐事件","summary":"弗隆提亞的雅西開拓村誘拐事件可早解；建議一開場有機會就優先處理。","steps":["抵達ヤシ開拓村，向相關居民打聽孩子失蹤。","進雅西洞窟尋找被囚者，擊敗阻擋怪物後回村回報。","舊資料將失效點記在 15% 左右，別等練到很強才去。"],"sources":["PS2-BEG-EARLY","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","早期時限"],"stage":"早期時限","risk":"15%附近是舊研究門檻；實際會受到前置與時間經過點影響。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-006","section":"新手","title":"第一批容易錯過：旅館老闆女兒","ja":"宿屋の娘／変死事件発生","summary":"梅爾維爾的旅館老闆女兒、連續怪死事件都屬早期案件，應在大量戰鬥前處理。","steps":["先到梅爾維爾（メルビル）與旅館、事件相關人物交談。","依現有本站「旅館老闆的女兒／連續怪死」條目追查。","舊研究把事件區間列成 0%～未滿 25%；不要拖到後期。"],"sources":["PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","早期時限"],"stage":"早期時限","risk":"來源有不同事件名稱與進度表，本站保留待校對註記。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-007","section":"新手","title":"任務比刷小怪更重要","ja":"序盤のおすすめイベント","summary":"新手的金錢與 Jewel 主要由完成事件取得。可優先解低難度事件。","steps":["依隊伍目前能抵達的地區，優先評估開拓村誘拐、烏漢吉的秘密、草原寶藏、壁虎族等早期任務。","不要為了純粹賺錢連續刷大量小怪；這會推進原版隱藏進度。","完成後回城補法術和地圖能力，然後再出發。"],"sources":["PS2-BEG-EARLY","PS2-BEG-GOLD","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","事件優先"],"stage":"事件優先","risk":"不需要也幾乎不可能第一輪全事件都解完。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-008","section":"新手","title":"金錢與 Jewel 要分開規劃","ja":"金／ジュエル","summary":"金錢主要買術、裝備與住宿；ジュエル主要用於修練技能與職業。","steps":["先預留購買恢復術、住宿與必要地圖能力的金錢。","把 Jewel 優先用在主力角色的主要武器、職業及必需地圖技能。","職業與武器學到基本程度後再思考高額升級，不要隨便把全部資源撒出去。"],"sources":["PS2-BEG-GOLD","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","資源管理"],"stage":"資源管理","risk":"金錢與 Jewel 不可互相當成相同貨幣使用。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-009","section":"新手","title":"療癒之水最好不只一人會","ja":"癒しの水／回復術","summary":"提早準備多名能補血的同伴，比盲目買昂貴武器有用。","steps":["到可販售水術的城鎮尋找「癒しの水」。","最好讓至少兩人會回血，一人被擊倒時仍有救援手段。","購買之前檢查角色職業與相剋術系統，避免預算浪費。"],"sources":["PS2-BEG-GOLD","PS2-BEG-CLASS"],"tags":["PS2原版","新手注意事項","戰鬥生存"],"stage":"戰鬥生存","risk":"戰鬥中回復與防禦往往比單純追求攻擊數字重要。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-010","section":"新手","title":"HP 與 LP 是兩回事","ja":"HP／LP／BP","summary":"HP 歸零會使角色倒地並減少 LP；LP 太低時不要繼續無腦硬拚。","steps":["戰鬥結束 HP 通常會自動回復，但 LP 不會因此恢復。","LP 低時先回城住宿；別讓夥伴累積損耗後消失。","過高消耗的技或術，以及戰鬥逃跑，也可能帶來 LP 風險。"],"sources":["PS2-BEG-PS2-FAQ","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","戰鬥生存"],"stage":"戰鬥生存","risk":"個別特技消耗依武器與職業不同，進戰鬥前看清代價。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-011","section":"新手","title":"連鎖戰不能中途逃跑","ja":"チェーンバトル／CHAIN","summary":"怪物聚在一起時，觸碰可能觸發連續戰鬥，整串結束前不能撤退。","steps":["進洞窟前看敵群密集程度；狹小路段不要一路衝。","一旦進入 CHAIN，注意全員 LP、BP、回復能力，避免連續戰耗盡。","打不過的雜魚單場可考慮逃離，但 PS2 逃跑需評估 LP 損失。"],"sources":["PS2-BEG-FIGHT","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","戰鬥生存"],"stage":"戰鬥生存","risk":"不要套用 Remastered 追加的煙玉袋／低成本逃跑規則。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-012","section":"新手","title":"武器先專精，隊伍保留多樣性","ja":"武器スキル／EP","summary":"新手先給每個人一種常用武器，修練對應技能；隊伍再分散成不同武器類型。","steps":["優先把各角色常用武器技能提升至 Lv2～Lv3。","持續使用武器與技，讓角色累積閃悟；隊伍混搭劍、弓、斧、槍、術較好應對。","注意高消耗招式的 EP／LP，無法無限亂用。"],"sources":["PS2-BEG-ITEMS","KYO-OLD-FAQ"],"tags":["PS2原版","新手注意事項","武器與技能"],"stage":"武器與技能","risk":"後期再考慮第二種武器與複雜改造。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-013","section":"新手","title":"職業不只修練，還要認證","ja":"クラス認定／修練所","summary":"單純提升技能，不等於已發揮職業的專屬效果。","steps":["到各城鎮修練所學會想要的職業需求技能。","符合條件後再到能認證該職業的場所接受認證。","常用職業先練到 Lv3 作為初期目標，再依 Jewel 餘額加強。"],"sources":["PS2-BEG-CLASS","KYO-OLD-FAQ"],"tags":["PS2原版","新手注意事項","職業"],"stage":"職業","risk":"不要把 2022 追加職業列為 PS2 可選。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-014","section":"新手","title":"地圖能力要裝上、次數要夠","ja":"マップアビリティ／宝箱サーチ","summary":"買了技能不代表已裝到地圖能力欄位，常因沒裝備或剩餘次數不足而卡住。","steps":["要進迷宮前查看本站迷宮卡的「寶箱搜尋、跳躍、攀爬、開鎖」需要程度。","地圖能力必須購買並裝備；隊伍中最高技能等級決定實際使用等級。","可使用次數與隊伍成員技能／設定相關；出發前確認剩餘次數。"],"sources":["KYO-MAP-ABILITY","KYO-OLD-FAQ"],"tags":["PS2原版","新手注意事項","地圖探索"],"stage":"地圖探索","risk":"不同寶箱有固定與隨機出現之別，不要只看掉落表當作必出。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-015","section":"新手","title":"盾牌不是任何動作都能防","ja":"盾／ディフレクト","summary":"裝了盾牌，也不代表使用雙手武器、術法時會自動發動。","steps":["檢查角色的主武器類型；盾的防禦發動取決於實際動作。","在能使用盾的單手武器搭配下才有發動機會。","沒有把握時先靠防禦、回復與裝備保命，不必硬追擋格率。"],"sources":["KYO-OLD-FAQ"],"tags":["PS2原版","新手注意事項","裝備"],"stage":"裝備","risk":"盾發動率也與技能、武器形式有關。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-016","section":"新手","title":"遊戲不會自動替 PS2 存檔","ja":"クイックセーブ／通常セーブ","summary":"2005 PS2 版沒有 2022 Remastered 的自動儲存系統；進重要事件前要親自存檔。","steps":["進入長迷宮、重要對話、Boss 門前，先使用原版可用的快速儲存。","回城或住宿時，也要做一般存檔，並保留可回退的紀錄。","不要把 Remastered 的自動存檔、隨處一般儲存與讀取體驗套用到 PS2。"],"sources":["FAQ-GRAY","PS2-BEG-REM-VS"],"tags":["PS2原版","新手注意事項","存檔"],"stage":"存檔","risk":"快存可能被新快存覆蓋；一般存檔與快存請分清。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-017","section":"新手","title":"同伴名額最多五位","ja":"仲間／吟遊詩人","summary":"隊伍包含主角最多五人；主角不能移出，其他同伴多半可在酒館透過吟遊詩人調整。","steps":["需要帶劇情 NPC 前先確認至少有空位，不然可能錯過事件同行。","一般同伴可在有吟遊詩人的 PUB 詢問移出隊伍。","部分角色一旦離隊無法重新招募，重要同伴先查角色卡。"],"sources":["PS2-BEG-COMPANION","PS2-BEG-START"],"tags":["PS2原版","新手注意事項","組隊"],"stage":"組隊","risk":"騎士團事件尤其要注意保留同行名額。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-018","section":"新手","title":"覺醒技能靠用，不靠買等級","ja":"閃き／技","summary":"武器招式通常透過戰鬥中的使用觸發閃悟；有些職業與武器需要搭配技能修練。","steps":["讓主力持續使用符合職業的武器招式。","對較強敵人有機會學到新招，但不要為了刷閃悟把 LP 耗光。","買技能的 Jewel 與打出新招式的戰鬥成長是兩種不同流程。"],"sources":["PS2-ORIGINAL-FAQ-2008","PS2-BEG-ITEMS"],"tags":["PS2原版","新手注意事項","戰鬥成長"],"stage":"戰鬥成長","risk":"稀有閃悟並不是保證遇強敵立即學會。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-019","section":"新手","title":"命運石不用十顆全收集","ja":"ディステニィストーン","summary":"命運石是重要寶物與事件要素，但第一輪要通關並不要求全部拿滿。","steps":["把已取得的寶石記錄下來並檢查裝備效果。","早期先以穩定完成主線及必要支線為目標。","不要為了追求一次全收集而讓所有任務逾期。"],"sources":["PS2-BEG-ITEMS","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","目標規劃"],"stage":"目標規劃","risk":"某些寶石有分歧與不可逆條件，收集派可另查個別攻略。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"BEGIN-020","section":"新手","title":"第二輪不等於 2022 的 NEW GAME+","ja":"周回引継ぎ／リマスター差異","summary":"2005 PS2 原版有部分周目沿用規則，但沒有 Remastered 的完整進度、道具與能力自由繼承選項。","steps":["別照 2022 版攻略期待全裝備與能力繼承。","先把第一輪當作認識事件、世界地圖與戰鬥的階段。","角色額外加入、新職業、可選進度速度與自動儲存等，都是需要排除的新版資料。"],"sources":["PS2-BEG-REM-VS","PS2-ORIGINAL-FAQ-2008"],"tags":["PS2原版","新手注意事項","版本注意"],"stage":"版本注意","risk":"PS2 的原始周目功能需另外按原版規則核對，不能直接叫 Remastered NEW GAME+。","quality":"2005 PS2 原版交叉整理；明確排除 2022 新機制"},{"id":"G001","section":"主角","title":"亞魯貝魯特","ja":"アルベルト","summary":"貴族騎士；開局地點：伊斯瑪斯城（イスマス）。羅莎利亞貴族，從伊斯瑪斯城的事件展開故事。","steps":["【開場整備】伊斯瑪斯城先確認亞魯貝魯特裝備；把治療藥箱也設為可使用武器，避免一進洞窟就無法回復。","【取得同伴】往下一層的王座廳找姊姊黛安娜（ディアナ）交談，黛安娜與兩名士兵加入。","【東洞窟】離城後前往伊斯瑪斯東洞窟（イスマス東の洞窟），一路至最深處，途中留意閃悟新劍技。","【洞窟頭目】惡魔斥候戰，首回合可能出現全體重力攻擊；黛安娜使用ハヤブサ斬り輸出，亞魯貝魯特用藥箱救急。","【領取獎勵】返回伊斯瑪斯城王座廳向父親回報，取得 Jewel。","【城陷落】夜間事件後再找黛安娜，從王座後方機關開啟祕道；入口旁有固定 2000 金寶箱，不要直接漏過。","【逃亡】經祕道遭遇紅龍，此為劇情戰、敗北也會繼續；醒來後依劇情抵達羅班（ローバーン）。","【羅班】優先取得「忍び足」「ジャンプ」等探索能力；被衛兵抓到可查移動牆壁機關逃出。","【乘船】由布魯艾雷（ブルエーレ）搭船前往約比爾（ヨービル），觸發雪原劇情。","【席芙加入】加托村（ガトの村）接怪物掃蕩委託，邀請席芙（シフ）同行；需處理東、西、南三座洞窟。","【解鎖世界】完成掃蕩取得騎士團領地圖，從雪原西南離開，到歐根施塔特（オイゲンシュタット）詢問米爾札布爾位置。","【序章結束】經米爾札布爾搭船返約比爾，再至水晶城會見奈特哈特（ナイトハルト）領取 Jewel，此後以自由任務為主。"],"sources":["BH-CHAR","FAQ-WALK","HERO-ROUTE-1","HERO-ART-1","OFFICIAL-GAME-SCREENS"],"tags":["貴族","伊斯瑪斯"],"stage":"伊斯瑪斯城（イスマス）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara1_chara.png","caption":"SQUARE ENIX 官方人物原畫｜亞魯貝魯特／アルベルト，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara1_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"守護前列／長劍與盾牌；優先防具、再擴充治療手段。","job":"貴族騎士","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G075","G080"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G002","section":"主角","title":"艾莎","ja":"アイシャ","summary":"塔拉爾遊牧民；開局地點：蓋雷薩草原（ガレサステップ）。遊牧民少女，開場位於蓋雷薩草原；與奈特哈特的劇情相關。","steps":["【探索草原】艾莎在塔拉爾族村（タラール族の村）出發，附近是蓋雷薩草原（ガレサステップ），初始單人戰鬥很脆弱。","【奈特哈特事件】草原遭敵擊敗時會觸發奈特哈特出現救援；這是原版序章的事件機制，不必硬打高強度敵人。","【對話分歧】被救後選「想去水晶城」可看一段城市事件；選返回村落不會卡住主線。","【取得地名】回村找族長尼札姆（ニザム），得知烏索（ウソ）的情報。","【招募霍克】從草原的東南路線往烏索，PUB 可找霍克（ホーク）加入，強化前排。","【擴張地圖】到北角（ノースポイント）PUB 找蜥蜴人蓋拉哈（ゲラ＝ハ），再搭船往戈東戈（ゴドンゴ）。","【前往巴法爾】經叢林走到威普（ウェイプ），可以搭船前往梅爾維爾（メルビル）解鎖更多任務。","【特殊分歧】若在蓋雷薩草原被人販子打敗，會接到「ウハンジの秘密」路線並轉移到南艾斯塔米爾；留獨立存檔以免錯過原本旅程。","【中期個人事件】「タラール族消失」是艾莎主角的特殊支線，與命運石黃玉（トパーズ）有關，推薦組滿隊伍後進行。","【隊伍準備】讓艾莎不要長期單人戰鬥；先有一名前衛、一名補師與穩定輸出，避免刷怪過量導致早期任務結束。"],"sources":["BH-CHAR","KYO-CHAR","HERO-ROUTE-2","HERO-ART-2","OFFICIAL-GAME-SCREENS"],"tags":["遊牧民","草原"],"stage":"蓋雷薩草原（ガレサステップ）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara2_chara.png","caption":"SQUARE ENIX 官方人物原畫｜艾莎／アイシャ，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara2_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"輕型前衛／優先補防具；不要單人挑戰高難度敵人。","job":"塔拉爾遊牧民","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G018","G089"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G003","section":"主角","title":"格雷","ja":"グレイ","summary":"尋寶冒險家；開局地點：傑爾頓（ジェルトン）／里高島。冒險者，開場有加拉哈德和米莉雅姆等同伴；古刀劇情是探索重點。","steps":["【傑爾頓開局】格雷（グレイ）在傑爾頓（ジェルトン）起步，帶加拉哈德（ガラハド）與米莉雅姆（ミリアム）。","【草原入口】從傑爾頓到草原（草原），往東南方洞口進財寶洞穴（財宝の穴），選「決死のダイヴ」下洞。","【B1／B2】探查固定箱及地圖；確認攀爬 Lv3、跳躍 Lv4、寶箱搜尋 Lv2 是完整挖寶所需技能，前期不足可先做主線。","【B3 古刀】地下三樓 T 字路中央調查生鏽古刀（さびた古刀），開啟「刀の声」事件；要走古刀支線別遺漏。","【洞窟頭目】至 B3 左上房間挑戰哥布林首領與多名哥布林，先清小怪或用閃悟強技集中攻擊頭目。","【固定獎勵】打倒頭目後可取得 500 金與弓；與 B3 固定 1000 金、古刀箱和隨機重生箱分開核對。","【離島條件】身上有 351 金以上時進入傑爾頓，可搭船前往梅爾維爾，不一定非得打完財寶洞穴。","【同行選擇】搭船途中選加拉哈德或米莉雅姆同行，這是路線建議差異，不代表另一位永久被禁止。","【重要招募】梅爾維爾港附近接受讓（ジャン）的委託「クローディアを守れ」，取得克蘿蒂雅（クローディア）同伴。","【後續配裝】格雷適合以刀與古刀養成作主線之一，但前期若戰力不足仍可選常規長劍／防護，沒有必要硬闖高階洞窟。"],"sources":["BH-CHAR","FAQ-GRAY","HERO-ROUTE-3","HERO-ART-3","OFFICIAL-GAME-SCREENS"],"tags":["冒險者","古刀"],"stage":"傑爾頓（ジェルトン）／里高島","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara7_chara.png","caption":"SQUARE ENIX 官方人物原畫｜格雷／グレイ，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara7_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"物理主攻／劍系技能；古刀培育另作長期路線。","job":"尋寶冒險家","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G079","G087"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G004","section":"主角","title":"克蘿蒂雅","ja":"クローディア","summary":"迷路森林守護者；開局地點：迷路森林（迷いの森）。在迷路森林成長的少女，與梅爾維爾和巴法爾帝國相關。","steps":["【迷途森林】克蘿蒂雅開場在迷途森林（迷いの森），先認清入口與深處樹屋，不要在分岔反覆刷怪。","【找歐爾】往森林深處、熊與狼所在區域找歐爾（オウル）談話。","【入口救人】走回最外側入口，救被襲擊的讓（ジャン）；事件戰鬥中會有支援。","【回深處】再次返回樹屋找歐爾，確認事件更新。","【固定寶箱】歐爾樹屋內有 100 金和 Jewel 的寶箱，離開前取走。","【出森林】穿過入口抵達梅爾維爾（メルビル），前往二樓伊莉莎白宮殿。","【宮殿守衛】對宮殿門衛交談兩次觸發事件，格雷（グレイ）正式加入。","【角色互斥注意】若錯過開場招募格雷的節點，格雷可能不出現在一般 PUB，請保留存檔。","【隊伍狀態】動物同伴席爾貝恩（シルベン）與布勞（ブラウ）在「オウルの呼び声」之前無法任意退出，事件完成後才離隊。","【自由旅行】可在梅爾維爾接旅館女兒及怪死事件，或到金礦接襲擊事件；隊伍需預留回復與地圖探索能力。"],"sources":["BH-CHAR","KYO-CHAR","HERO-ROUTE-4","HERO-ART-4","OFFICIAL-GAME-SCREENS"],"tags":["森林","梅爾維爾"],"stage":"迷路森林（迷いの森）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara4_chara.png","caption":"SQUARE ENIX 官方人物原畫｜克蘿蒂雅／クローディア，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara4_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"弓箭遠程／後列；搭配一名防禦型前衛。","job":"迷路森林守護者","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G081","G017"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G005","section":"主角","title":"賈米爾","ja":"ジャミル","summary":"南艾斯塔米爾盜賊；開局地點：南艾斯塔米爾（南エスタミル）。南艾斯塔米爾出身的盜賊，開場牽涉法拉與烏漢吉的秘密。","steps":["【南艾斯塔米爾】賈米爾（ジャミル）從南艾斯塔米爾（南エスタミル）出發，先到西南法拉（ファラ）的家外對話。","【酒館情報】到城鎮中央 PUB 和櫃檯女性、裡側男子對話，接受後宮調查委託。","【誘拐發生】再回法拉家確認法拉被綁架。","【奴隸商人】往城北奴隸商人家，擊倒商人；若太弱，可先乘船往北艾斯塔米爾招募同伴。","【跨城移動】南北艾斯塔米爾可搭船往來，準備少量船費，別急著在城裡與雜兵死鬥。","【神殿密室】前往北艾斯塔米爾的阿姆特神殿（アムト神殿），調查深處右側隱藏房間。","【守衛戰】擊敗烏漢吉守衛（ウハンジガード）救人。","【重大選擇】決定是否饒過烏漢吉；殺害會影響後續劇情，第一次遊玩建議選饒恕並另外存檔。","【領取獎勵】回法拉家對話領 Jewel，再到南艾斯塔米爾 PUB 委託人處領 2500 金。","【自由行動】完成「ウハンジの秘密」後再擴展地圖，優先補 5 人隊、鍛造與恢復手段。"],"sources":["BH-CHAR","KYO-CHAR","HERO-ROUTE-5","HERO-ART-5","OFFICIAL-GAME-SCREENS"],"tags":["盜賊","艾斯塔米爾"],"stage":"南艾斯塔米爾（南エスタミル）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara3_chara.png","caption":"SQUARE ENIX 官方人物原畫｜賈米爾／ジャミル，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara3_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"速度型攻擊／細劍；搭配控場與回復。","job":"南艾斯塔米爾盜賊","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G013","G091"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G006","section":"主角","title":"席芙","ja":"シフ","summary":"巴爾哈蘭特女戰士；開局地點：加托村（ガトの村）。巴爾哈蘭特的女戰士，雪地與加托村相關劇情為開場重點。","steps":["【加托村接任務】席芙（シフ）開場於加托村（ガトの村），去村落深處族長加托（ガト）家接巴爾哈蘭怪物討伐。","【召集隊員】PUB 可招募巴爾哈蘭戰士與吟遊詩人，提高隊伍人數與 LP 緩衝。","【東洞窟】東之洞窟（東の洞窟）入口附近就有屍鬼頭目；補滿 HP 再進去。","【西洞窟】西之洞窟（西の洞窟）初段分岔走左側可取得地圖；深處是魔眼蟲與幻眼蟲的戰鬥。","【南洞窟】南之洞窟（南の洞窟）深入後與佩吉首領等敵對戰；勝利後可再往深處取兩個寶箱。","【首次回報】三座洞窟都完成後回加托村領約 200 金和 Jewel。","【劇情遇險】離村往山坡可遇到落難亞魯貝魯特，救援後再找加托取得下一輪掃蕩任務。","【邀請亞魯貝魯特】在加托村對話選願意同行，他會加入席芙隊伍。","【第二輪掃蕩】再調查東、西、南三座洞窟，注意怪物和地形條件可能與前次不同。","【世界地圖】完成第二次回報，取得騎士團領地圖，從雪原西南出口到歐根施塔特，之後才能展開各地自由旅行。","【失敗風險】席芙序章戰鬥次數較多，隱藏劇情進度上升快；早期「開拓村誘拐事件」可能來不及接，想全事件請規畫周目。"],"sources":["BH-CHAR","KYO-CHAR","HERO-ROUTE-6","HERO-ART-6","OFFICIAL-GAME-SCREENS"],"tags":["雪原","戰士"],"stage":"加托村（ガトの村）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara6_chara.png","caption":"SQUARE ENIX 官方人物原畫｜席芙／シフ，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara6_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"高耐久近戰／大劍或斧；前線承傷。","job":"巴爾哈蘭特女戰士","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G092","G097"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G007","section":"主角","title":"霍克","ja":"ホーク","summary":"海盜船長；開局地點：珊瑚海（サンゴ海）。珊瑚海海盜船長，與海賊據點、銀之財寶有關。","steps":["【珊瑚海開場】霍克（ホーク）在珊瑚海（サンゴ海）的海盜船 Lady Luck 開始，先熟悉船隻與海蝕洞位置。","【前往海盜岸】經珊瑚海中央偏西北的洞窟 C 到海賊據點（パイレーツコースト）。","【遇民船】航程若攔截民船，勝利後可選擇放人取得 100 金，或不放人取得 300 金；抉擇會影響角色扮演立場。","【集會所】進海盜岸右端集會所觸發事件；可選主動迎戰，或暫時退避再返回推動劇情。","【再度出海】從海盜岸乘船返回珊瑚海，依事件發展處理遭追擊劇情。","【回集會所】再進海盜據點集會所，確認海盜關係變化。","【逃離】打敗或避開沿途海盜，盡快返回船隻，不必為零散戰鬥反覆刷怪。","【序章結束】從珊瑚海出航後失去 Lady Luck，劇情將霍克送往戈東戈（ゴドンゴ）。","【新地圖】經叢林（ジャングル）到威普（ウェイプ），可開始壁虎族任務，並乘船到梅爾維爾。","【補齊隊伍】優先在 PUB 找格雷或芭芭拉等同伴解鎖新地點，另準備遠程輸出和補血。"],"sources":["BH-CHAR","KYO-CHAR","HERO-ROUTE-7","HERO-ART-7","OFFICIAL-GAME-SCREENS"],"tags":["船長","海盜"],"stage":"珊瑚海（サンゴ海）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara5_chara.png","caption":"SQUARE ENIX 官方人物原畫｜霍克／ホーク，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara5_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"斧／曲刀類主攻；利用前後列與隊友補血穩定戰線。","job":"海盜船長","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G082","G034"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G008","section":"主角","title":"芭芭拉","ja":"バーバラ","summary":"巡迴舞者；開局地點：旅藝人一行／新道路（ニューロード）。巡迴舞者，初期持有命運石「幻之紫水晶」，地圖開拓方便。","steps":["【西端開局】芭芭拉（バーバラ）初期在西端（ウエストエンド）與巡迴表演團同行，已可活動多個地區。","【取得命運石】到西端 PUB 與吟遊詩人交談，選擇表演舞蹈，取得命運石「幻之紫水晶（幻のアメジスト）」。","【容易錯過的提示】此對話並非自由行動的前置必要條件，然而建議初次玩先拿寶石並保留存檔。","【同伴調整】同行的艾爾曼（エルマン）前期戰力有限，盡早進 PUB 組滿五人，安排前衛與回復者。","【地圖優勢】芭芭拉最早就能拜訪多個地區；以解鎖地名、收集情報、避免過量戰鬥為優先。","【初期任務】到梅爾維爾警備隊附近查旅館相關事件，或到南北艾斯塔米爾接短流程委託換 Jewel／金。","【邊境事件】前往雅西開拓村留意誘拐事件，未來再處理可能因隱藏進度提高而關閉。","【角色養成】回復與防具優先、搭配一名可以使用弓術或輔助術的後排隊員，再挑戰洞窟。","【獨有節奏】芭芭拉的專屬序章極短，不代表全遊戲只有幾步；後續要依區域、進度、任務條件分批探索。"],"sources":["BH-CHAR","NEOSEEK","HERO-ROUTE-8","HERO-ART-8","OFFICIAL-GAME-SCREENS"],"tags":["舞者","紫水晶"],"stage":"旅藝人一行／新道路（ニューロード）","risk":"","quality":"2005 PS2原版角色開場流程另列；圖為Square Enix 官方 Remastered 實際遊戲畫面。序章不等於全劇情破關，周目章節另連至本站任務分支。","gallery":[{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara8_chara.png","caption":"SQUARE ENIX 官方人物原畫｜芭芭拉／バーバラ，非生成圖、非玩家自繪。"},{"src":"https://www.jp.square-enix.com/saga_minstrelsong/assets/img/chara8_img.jpg","caption":"SQUARE ENIX 官方 Remastered 實際遊戲劇情畫面（人物介紹附圖，畫面中的角色不一定是主角本人）。"}],"role":"靈活支援／可視隊伍缺口補法術、回復與地圖技能。","job":"巡迴舞者","heroSource":"https://www.jp.square-enix.com/saga_minstrelsong/","heroChapters":[{"title":"第一章｜專屬開場事件","description":"上面的逐條流程只是這位主角的序章，完成後才會正式進入世界自由探索。請先完成或確認下列主角關聯事件；不代表已經全破。","ids":["G021","G009"]},{"title":"第二章｜早期時限委託（進度約 0～40%）","description":"各主角共用同一大世界，但任務可因戰鬥累積而消失。先找酒館、確認地名、準備回復術和地圖能力，再做限時支線；這些是可選任務，不是每項強制。","ids":["G009","G010","G011","G012","G013","G014","PS2-GUIDE-002"]},{"title":"第三章｜中期連鎖與命運石（約 40～70%）","description":"古文書→兩種象徵→雙月神殿→皇帝怪病務必趕在失效前完成；水龍神殿、雨雲手鐲、四天王也有相互影響。開鎖／跳躍／寶箱搜尋需事先修習。","ids":["G084","G085","G019","G023","G074","G024","G020","PS2-ROUTE-016"]},{"title":"第四章｜後期危險地區（約 70～100%）","description":"視周目狀態選擇暗殺者公會、金礦、梅爾維爾襲擊、提奧多爾與魔之島；先預留存檔，逐一讀取迷宮寶箱、機關及頭目策略，不要只看地圖走最短路。","ids":["G026","G028","G029","G031","G034","G095","G030"]},{"title":"第五章｜三地點、最終迷宮、沙魯因","description":"最終試煉／冥府／古老之城由詩人情報和信仰路線決定，並非三座都是每輪強制。先確認三地點情報、隊伍回復和裝備，再進最終迷宮；一般沙魯因與獻十顆命運石的強化型難度不同。","ids":["G046","G035","G036","G037","D-11-06","G038","STR-002"]}]},{"id":"G009","section":"任務","title":"開拓村誘拐事件","ja":"開拓村の誘拐事件","summary":"弗隆提亞・亞西開拓村","steps":["【觸發】從西端進雅西開拓村（ヤシ開拓村），向吟遊詩人旁女性詢問小孩被誘拐事件。","【時限】原版進度約15%以內優先做，若刷怪太多事件可能已過期。","【出發】取得雅西洞窟（ヤシの洞窟）位置後補滿 HP，建議寶箱搜尋 Lv1 並留獨立存檔。","【地下 B1】先拿固定洞窟地圖，跟著原始洞窟圖辨識通往地下2層的出口。","【地下 B2】固定寶箱可得100金＋Jewel、500金＋Jewel，別與隨機箱混淆。","【深處】擊敗誘拐事件相關魔物，確認 NPC 與事件狀態更新。","【回村】返回亞西開拓村與委託人交談、確認玩家筆記完成事件；早期 Jewel 可留給地圖能力。"],"sources":["EV-01","KYO-TIME-LIST","FFSKY-DRY","PS2-SURUME-EVENT","PS2-KYO-YASHI"],"tags":["失敗不可逆","0%可開始；15%附近結束"],"stage":"0%可開始；15%附近結束","risk":"早期會消失；越早越好。","quality":"以原版事件、原版樓層與時限來源整理；具進度或周目差異的選項會個別註明。","gallery":[]},{"id":"G010","section":"任務","title":"旅館老闆的女兒／連續怪死","ja":"宿屋の娘／変死事件発生","summary":"梅爾維爾","steps":["向警備隊受託→酒館告示與旅館談話→追蹤可疑男子入下水道→擊敗神官。","旅館老闆女兒與連續怪死是相互影響事件，25%前完成，另留意克洛蒂雅初期事件旗標。"],"sources":["EV-02","KYO-EVENTS","FFSKY-DRY","KYO-TIME-LIST","BH-MAP-SKILLS","PS2-SURUME-EVENT"],"tags":["順序重要","0%～未滿25%"],"stage":"0%～未滿25%","risk":"兩條事件可一起解，先查看酒館告示再接旅館委託。 修訂依據：PS2 原版的「旅館老闆的女兒／變死事件」可從最初到未滿25%進行；原草稿的15–30%有誤。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G011","section":"任務","title":"金礦襲擊事件","ja":"ゴールドマイン襲撃事件","summary":"金礦／梅爾維爾","steps":["金礦金庫戰鬥→追到梅爾維爾下水道→查明主謀→向王宮報告。","金礦「初期襲擊」與70%後的「礦山襲擊」不是同一事件。","2005巴哈：金礦街上無人、金庫衛兵倒地時觸發。進金庫遇賊，戰勝後向外面的官員詢問。","到梅爾維爾地下水道追賊，選擇戰鬥（放過會影響任務），沿通道查出幕後主使，結束後回宮殿領獎。","2005玩家記載獎勵為2500金及ジュエル；並提醒與「旅館老闆女兒／怪死」同時處理可能有問題，屬玩家報告待實測。"],"sources":["EV-03","KYO-TIME-LIST","FFSKY-DRY","PS2-SURUME-EVENT","BH05-GOLD-VAULT"],"tags":["易錯過","15%～未滿30%"],"stage":"15%～未滿30%","risk":"早期時限任務；2005玩家報告「宿屋の娘／変死事件」並行可能產生事件問題，先分別處理並存檔。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G012","section":"任務","title":"騎士團的榮耀","ja":"騎士団の誇りにかけて","summary":"騎士團領","steps":["到歐根施塔特見海因里希→前往米爾札布爾→依選項同行並探索砦跡。","騎士團的榮耀為早期時限事件，不等同90%後「提奧多爾失常」。","2005巴哈：若想讓提奧多爾與拉斐爾一起暫時加入，會議前最好保留兩個隊伍空位。","要塞遺跡二樓右側的地板刻意跑動使其崩落；再往下掉到地下最深處迎戰頭目。","原版攻略記載同行與否可能影響獎勵（2000金或1000金）；未經實機重新驗證。"],"sources":["EV-04","KYO-TIME-LIST","FFSKY-DRY","PS2-SURUME-EVENT","BH05-KNIGHTS"],"tags":["有時限","15%～未滿40%"],"stage":"15%～未滿40%","risk":"席芙或亞魯貝魯特開場有特別條件。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G013","section":"任務","title":"烏漢吉的秘密","ja":"ウハンジの秘密","summary":"南／北艾斯塔米爾","steps":["【接任務】南艾斯塔米爾 PUB 和女性委託人交談，取得烏漢吉相關情報。","【法拉】到法拉（ファラ）的住處確認事件與被誘拐的線索。","【奴隸商人】向北調查奴隸商人家，遇戰鬥若扛不住先組滿隊。","【神殿入口】轉往北艾斯塔米爾阿姆特神殿（アムト神殿）調查秘密房間。","【解救】擊敗烏漢吉守衛並救出被囚禁者。","【分歧】烏漢吉的生死選擇可能影響後續，第一次遊玩建議先另存再決定。","【交差】回法拉家與酒館委託人，確認 Jewel 及金錢報酬是否入帳。"],"sources":["EV-05","KYO-EVENTS","KYO-CHAR"],"tags":["分歧"],"stage":"早期・酒館接任務未滿30%","risk":"賈米爾的重要初期事件，處置烏漢吉會影響後續。","quality":"以原版事件、原版樓層與時限來源整理；具進度或周目差異的選項會個別註明。","gallery":[]},{"id":"G014","section":"任務","title":"紹基洞窟的怪物","ja":"サオキの魔物","summary":"紹基開拓村","steps":["到紹基開拓村取得情報，處理洞窟怪物。","取得紹基村情報後可調查；村莊可能因寶石獸劇情受影響。"],"sources":["KYO-TIME-LIST","PS2-SURUME-EVENT"],"tags":["有時限","20%起"],"stage":"20%起","risk":"可及早清掉；吸血鬼事件可能讓任務失去觸發機會。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G015","section":"任務","title":"尼維爾的委託","ja":"ネビルの依頼","summary":"梅爾維爾","steps":["在梅爾維爾追查尼維爾委託；具體分歧看原站。","尼維爾委託需先有相關接觸旗標，原版研究列出先完成早期相關事件的條件。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","PS2-SURUME-EVENT"],"tags":["30%起"],"stage":"30%起（有前置）","risk":"中期解鎖，與巴法爾帝國人物相關。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G016","section":"任務","title":"迷途蝴蝶","ja":"迷いの蝶","summary":"梅爾維爾／迷路森林","steps":["在梅爾維爾酒館留意有關蝴蝶的委託，調查委託人的住處。","夜間追逐發光蝴蝶進入迷途森林；取得ムクロペンダント（骷髏墜飾）與夜光草。","回到梅爾維爾將物品交回委託人。","迷途蝴蝶可在後期重新調查，但會受同區域連鎖事件影響。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","FFSKY-2005-LATE","PS2-SURUME-EVENT"],"tags":["35%起"],"stage":"35%起","risk":"透過城市情報與森林線索處理事件。 攻略次序已與2005年舊文交叉核對，分支細節仍依PS2實際事件狀態判定。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G017","section":"任務","title":"貓頭鷹的呼喚","ja":"オウルの呼び声","summary":"迷路森林","steps":["沿克蘿蒂雅相關劇情進入森林深處。","與現行混合站部分30%資料不一致；採明指PS2原版研究的40%。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","PS2-SURUME-EVENT"],"tags":["40%起"],"stage":"40%起","risk":"與克蘿蒂雅路線有關，取得貓頭鷹相關裝備。 修訂依據：對照事件表是30%起；原草稿寫約40%缺依據。 版本衝突：極限攻略現行表列「30%起」，但2005原版事件研究明列40%；以2005原版研究優先，仍需同年代獨立來源核對。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G018","section":"任務","title":"塔拉爾族消失","ja":"タラール族消失","summary":"羅莎利亞／卡克拉姆沙漠","steps":["追查塔拉爾族行蹤，再深入沙漠及涅薩神殿。","與塔拉爾族消失、沙漠線相連，注意草原事件被劇情強制觸發。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","PS2-SURUME-EVENT"],"tags":["35%起"],"stage":"35%起","risk":"與命運石托帕茲相關。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G019","section":"任務","title":"古文書／皇帝病危","ja":"古文書／皇帝の奇病","summary":"梅爾維爾／雙月神殿","steps":["先處理壁虎族與古文書線索→前往雙月神殿取得月石→及時回宮治病。","先讓ゲラ＝ハ加入並完成壁虎族解放，古文書可由虎克相關線取得或向他購買；去梅爾維爾圖書館翻譯。","北艾斯塔米爾的アムト神殿取得護符，再到迷途森林取得エリス的護符，才能進雙月神殿。","2005原版共同研究將皇帝病期限定在45%～未滿70%；途中打太多戰鬥可能導致事件過期，拿到月亮石仍救不了病人。"],"sources":["EV-06","KYO-TIME-LIST","FFSKY-DRY","BH05-CHAIN","BH05-MID1"],"tags":["易錯過"],"stage":"45–未滿70%（皇帝病危）","risk":"獲得月石的核心事件；Boss 強，勿拖到事件失效。","quality":"已核對共通事件；進度條與新版便利功能不適用PS2","gallery":[]},{"id":"G020","section":"任務","title":"康斯坦茲遭綁架","ja":"コンスタンツ誘拐","summary":"騎士團領","steps":["【時限】劇情進度45%至未滿85%，到米爾札布爾城（ミルザブール）地下牢找拉斐爾（ラファエル）；某些騎士團前置邀請會影響觸發。","【尋求情報】去歐根施塔特城（オイゲンシュタット）問海因里希，取得拜澤爾海姆（バイゼルハイム）的位置。","【塔樓謎題】進拜澤爾海姆的芙拉瑪之塔（フラーマの塔），連續踩同色地板三次才會抵達芙拉瑪。","【對話】向芙拉瑪詢問康斯坦茲（コンスタンツ）的下落，解鎖囚禁地。","【塔樓寶箱】從入口連踩紅色可到炎之杖（炎のロッド）和緋紅法袍（スカーレットローブ）的寶箱；藍色可找到法師杖（メイジスタッフ）。","【康斯坦茲石像一】進場正面石像往左前方推，打開左邊隱路；走到盡頭再調查石像。","【康斯坦茲石像二】回到入口右轉，第二座石像往左推開新的通道。","【頭目】深處面對2隻食人魔（オーガ）和2隻哥布林法師（ゴブリンメイジャン）；先準備回復與減傷。","【交差】救出康斯坦茲後可得5000金＋Jewel；原站有拒絕名譽騎士稱號10次提高金錢的特殊情況。","【時限風險】後期提奧多爾失常事件開始會改變此任務的完成狀態，勿拖到結束條件才回頭救人。"],"sources":["EV-07","KYO-EVENTS","KYO-TIME-LIST","PS2-SURUME-EVENT"],"tags":["45%～未滿85%"],"stage":"45%～未滿85%","risk":"涉及弗拉瑪與城砦機關，後續事件可能接替結局。","quality":"參照2005 PS2 原版事件資料及延續版本攻略細節整理；原站可能在2022後增修，已避開新增角色機制。","gallery":[]},{"id":"G021","section":"任務","title":"幻之紫水晶","ja":"「幻」のアメジスト","summary":"西區／芭芭拉","steps":["芭芭拉角色從旅途中取得；其他主人公邀請芭芭拉入隊。"],"sources":["EV-08","KYO-EVENTS","NEOSEEK"],"tags":["命運石"],"stage":"開場可取得","risk":"芭芭拉初期持有紫水晶；非芭芭拉主人公可經由加入取得。","quality":"已核對共通事件；進度條與新版便利功能不適用PS2","gallery":[]},{"id":"G022","section":"任務","title":"吸血鬼復活","ja":"ヴァンパイア復活","summary":"西區／地下墓窖","steps":["【開始條件】2005 PS2 原版約50%後，在西端（ウエストエンド）酒館詢問男子得知吸血鬼復活，解鎖吸血鬼洞窟。","【聖杯支線】到北艾斯塔米爾 PUB 問聖杯情報，再進艾斯塔米爾地下道的墓窖（カタコーム）。","【十二棺材】墓窖有12口棺材，聖杯位置隨機；其他棺材可能遇敵或跌落陷阱，建議每檢查一口前存檔。","【可選】聖杯僅在本事件進行期間可取，能協助吸血鬼戰，但不是完成必要條件。","【吸血鬼洞窟B1】深入地下1層會遇到吸血鬼僕從三隻。","【B2～B3】這兩層的普通僕從戰可選擇避開，不必清光才算過關。","【B4】跟小孩交談後與狼人（ウェアウルフ）交戰；原站提供約1500 HP 參考值。","【最終岔路】最後分岔右轉挑戰吸血鬼頭目，左轉能離開；確認裝備、回復術與存檔。","【回程】擊退頭目後事件完成，地下4層有回到洞外的出口。","【不可逆條件】事件發生後雅西開拓村夜晚可能遭吸血鬼侵襲；原站記載此事件開始後紹基魔物委託不再出現。"],"sources":["EV-09","KYO-EVENTS","KYO-TIME-LIST","PS2-SURUME-EVENT"],"tags":["順序重要","50%起"],"stage":"50%起","risk":"開啟後可趁機取得聖杯；會影響開拓村及部分其他事件。","quality":"參照2005 PS2 原版事件資料及延續版本攻略細節整理；原站可能在2022後增修，已避開新增角色機制。","gallery":[]},{"id":"G023","section":"任務","title":"水龍神殿","ja":"水竜の神殿","summary":"庫加拉特／瑪拉爾湖","steps":["先在北艾斯塔米爾調查失蹤少女並取得塔爾米塔情報。","到塔爾米塔，夜間水位下降時由隱藏階梯進入塞克特宮殿地下，追查偽太守。","前往馬拉爾湖搭船到水龍神殿；與太守交戰後，向水龍談判少女獲救條件。","若選擇交換，向大坑底部的阿迪利斯取得「雨雲手鐲」，再帶回神殿談判；另有直接戰鬥分支。","水龍神殿50%後可觸發；能否入內與少女事件前置狀態相關。"],"sources":["KYO-FOUR","KYO-EVENTS","FFSKY-2005-LATE","PS2-GOR-WATER","PS2-SURUME-EVENT"],"tags":["事件鏈","50%起"],"stage":"50%起","risk":"四天王交涉鏈起點之一，相關任務互有先後。 攻略次序已與2005年舊文交叉核對，分支細節仍依PS2實際事件狀態判定。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G024","section":"任務","title":"探索海藍寶石","ja":"アクアマリン探索","summary":"羅莎利亞／水晶湖","steps":["與奈特哈特交談、取得水晶湖情報→進入水面洞窟→擊敗幽靈船取得海藍寶石。","如預先接受ナイトハルト委託，原版研究指出80%後仍有機會繼續，不能一概判定必失敗。","湖面漣漪是隱藏洞窟入口，A～D四洞窟要往D方向找；六座石像的石化煙霧區域可沿左側隱藏路通過。","2005巴哈稱末端遭遇章魚類頭目，舊稿另一來源稱幽靈船；記為「洞窟深處頭目」以免混淆不同戰點。","進水晶湖洞窟前裝好跳躍 Lv1；想多拿寶箱建議提高到 Lv2 並備寶箱搜尋。","目標海藍寶石在洞窟 D，跟隨洞內水晶／石像機關前進，勿把隨機箱誤當任務石。"],"sources":["EV-10","KYO-TIME-LIST","KYO-EVENTS","PS2-SURUME-EVENT","BH05-AQUAMARINE","PS2-KYO-CRYSTAL"],"tags":["易錯過","55%～未滿80%"],"stage":"55%～未滿80%（一般）","risk":"留意水晶湖深處石化煙霧及任務期限；不同舊站頭目名稱有衝突，暫不保證單一頭目。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G025","section":"任務","title":"靈魂吸取者","ja":"ソウルドレイン","summary":"烏索／乾燥地帶","steps":["前往烏索調查事件，逐步追查線索；精確條件請以原站為準。"],"sources":["KYO-TIME-LIST","KYO-EVENTS"],"tags":[],"stage":"55%起","risk":"跟村落異常與調查線索相關。","quality":"已核對共通事件；進度條與新版便利功能不適用PS2","gallery":[]},{"id":"G026","section":"任務","title":"暗殺者公會","ja":"暗殺者ギルド","summary":"南艾斯塔米爾","steps":["在南艾斯塔米爾追查暗殺者：接觸流浪兒／酒館與盜賊公會；旅館投宿後受到暗殺。","取得暗殺者公會位置後入內；迷宮依亮光指向行進，不能只記死方向而忽略岔路。","進入主線深處擊敗暗殺者首領；另有與Dark相關的祭壇岔路，並非這個任務的必經目標。","暗殺者公會約60%出現，但若Dark相關支線變化會有未決終了風險。","2005巴哈：南艾斯塔米爾酒館打聽盜賊；付費旅館夜間會遭暗殺，並可由法菈／其他事件取得公會入口。","進入公會後，依十字路口發光的方向找首領，這比隨機走岔路可靠。","2005原版記載低於75%時可能取得寶石獸位置情報；此為玩家攻略條件，受事件前置影響。"],"sources":["EV-11","KYO-TIME-LIST","KYO-EVENTS","FFSKY-2005-LATE","PS2-GOR-ASSASSIN","PS2-SURUME-EVENT","BH05-ASSASSIN"],"tags":["60%起"],"stage":"60%起","risk":"酒館、盜賊公會與夜間襲擊相連；牽涉寶石獸情報。 攻略次序已與2005年舊文交叉核對，分支細節仍依PS2實際事件狀態判定。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G027","section":"任務","title":"寶石獸","ja":"ジュエルビースト！","summary":"弗隆提亞","steps":["從水龍相關任務或暗殺者公會取得情報→進入封印洞窟→挑戰寶石獸。"],"sources":["EV-12","KYO-EVENTS","KYO-RESEARCH","KYO-TIME-LIST","PS2-SURUME-EVENT"],"tags":["高難度"],"stage":"80%起（事件）；地圖可能提前開啟","risk":"極高難度首領；會隨時間摧毀城鎮。 修訂依據：事件表約80%起，但洞窟可在更早由其他條件開啟；不可混為同一件事。 注意原版研究70%已有寶石獸甦醒節點、75%移動、80%邊境襲擊；非單一80%開始。","quality":"已核對共通事件；進度條與新版便利功能不適用PS2","gallery":[]},{"id":"G028","section":"任務","title":"金礦大規模襲擊","ja":"鉱山襲撃","summary":"金礦","steps":["前往金礦處理大量魔物與礦道。","原版研究「鉱山襲撃」與前期15%金礦遭襲不同，千萬別混用條件。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","PS2-SURUME-EVENT"],"tags":["70%起"],"stage":"70%起","risk":"後期礦場事件；與早期金礦襲擊是兩件不同事件。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G029","section":"任務","title":"梅爾維爾襲擊計畫","ja":"メルビル襲撃計画","summary":"梅爾維爾","steps":["在梅爾維爾下水道調查海賊據點及可疑暗門；可提前報告警備隊。","當後期港口受到攻擊，先到港口處理海賊頭目，再經下水道／神殿探查異變。","最後回到宮殿迎戰大型飛龍，完成梅爾維爾襲擊事件。","梅爾維爾後期遭海賊襲擊，與皇帝怪病、地下神殿等事件有互動。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","FFSKY-2005-LATE","PS2-SURUME-EVENT"],"tags":["80%起"],"stage":"80%起","risk":"城內守衛、海賊與後期戰局有關。 攻略次序已與2005年舊文交叉核對，分支細節仍依PS2實際事件狀態判定。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G030","section":"任務","title":"烏科姆海底神殿","ja":"ウコムの海底神殿","summary":"海底神殿","steps":["進度達85%以後，先確認當輪事件是否解鎖烏科姆海底神殿。","探索水下神殿第1至第3樓，隨機寶箱不一定固定位置。","進入第4樓，取得原版命運石「ブラックダイア（黑鑽石）」。","海底神殿出現原版研究標85%，入口與寧芙像事件關聯。"],"sources":["KYO-TIME-LIST","KYO-EVENTS","FFSKY-2005-LATE","PS2-SURUME-EVENT"],"tags":["命運石","85%起"],"stage":"85%起","risk":"命運石黑鑽石相關後期事件。 攻略次序已與2005年舊文交叉核對，分支細節仍依PS2實際事件狀態判定。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G031","section":"任務","title":"提奧多爾失常","ja":"テオドール乱心","summary":"騎士團領","steps":["見海因里希→尋找康斯坦茲→調查米爾札布爾隱藏通道→救援提奧多爾。","提奧多爾失常事件為後期劇情，和15%騎士團早期任務分離。","奧伊根施塔特詢問相關人物，再向康斯坦茲取得騎士團鑰匙；經米爾札布爾城內隱藏通道到提奧多爾房間。","閱讀提奧多爾私室便條開啟邪教廢墟。","在廢墟蠟燭迴圈判斷岔路，救出提奧多爾後回拜澤爾海姆結束事件；巴哈2005玩家獲得火之紅寶石。","在歐根施塔特找海因里希、至拉斐爾房向康斯坦茲拿騎士團鑰匙，再利用米爾札布爾城的隱藏通道。","到城內三樓調查提奧多爾房間中間的紙條，才會顯示邪教廢墟位置。"],"sources":["EV-13","KYO-TIME-LIST","KYO-EVENTS","PS2-SURUME-EVENT","BH05-THEO","PS2-ALISATO-2005","PS2-KYO-CULT"],"tags":["命運石","90%起"],"stage":"90%起","risk":"2005巴哈玩家自述部分前置條件未確定；路線有多種，勿當唯一方式。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G032","section":"任務","title":"傳說的龍騎士","ja":"伝説の竜騎士","summary":"騎士團領／龍之谷","steps":["【開始條件】先完成「提奧多爾失常（テオドール乱心）」，並把隊伍人數降到4人以下。","【接受委託】前往歐根施塔特（オイゲンシュタット）謁見廳，向海因里希（ハインリヒ）回答願意協助，讓拉斐爾（ラファエル）入隊。","【抵達龍之谷】地圖解鎖竜の谷，往最深處進龍之庭。","【事前布陣】把前列、中列、後列各安排一名可發動相容連攜技的隊員，確認同類技能修練等級；未提升技能的連攜成功率較低。","【龍騎士戰】在戰鬥開始以□指定行動順序為前→中→後，各使用能形成連攜的招式；成功達成龍陣（龍陣）後事件才會完成。","【獎勵】學會龍陣後可獲得聖騎士盾（聖騎士の盾）和 Jewel。","【角色分歧】若曾見過奈特哈特又未讓其加入，之後可能發生奈特哈特擊敗龍騎士的分支，使龍騎士無法加入。","【可選後續】事件後以未滿5人隊伍再次進龍之谷，可在條件允許時招龍騎士與迷你翁對戰；席芙主角另有銀龍和龍之眼事件。"],"sources":["EV-14","KYO-TIME-LIST","KYO-EVENTS"],"tags":["特殊戰鬥"],"stage":"提奧多爾事件後","risk":"隊伍須預留空格，戰鬥中完成龍陣。","quality":"參照2005 PS2 原版事件資料及延續版本攻略細節整理；原站可能在2022後增修，已避開新增角色機制。","gallery":[]},{"id":"G033","section":"任務","title":"冰劍","ja":"アイスソード","summary":"托瑪艾火山／阿爾茲爾","steps":["托瑪艾火山見火焰泰倫特→阿爾茲爾追查冰劍→依個人選擇取得或交付。","冰劍和火神防禦輪、四天王交換連動，按四天王事件進行，別套用新版任務旗標。"],"sources":["EV-15","KYO-EVENTS","KYO-FOUR","PS2-SURUME-EVENT"],"tags":["分歧","任務鏈，不以單一進度推論"],"stage":"任務鏈，不以單一進度推論","risk":"與弗雷姆泰倫特交涉取得任務，再處理冰劍來源與加拉哈德相關選項。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G034","section":"任務","title":"銀的財寶","ja":"海賊シルバーの財宝","summary":"瓦隆島／叢林","steps":["【前置】先完成壁虎族（ゲッコ族）或梅爾維爾襲擊計畫（メルビル襲撃計画）其中一項。","【情報】向壁虎族村居民或海盜岸（パイレーツコースト）深處海盜詢問銀之財寶。","【能力準備】必須裝備機關搜尋（仕掛けサーチ）；建議陷阱解除（ワナ解除）至少Lv3。較難寶箱另須寶箱搜尋較高等級。","【入口】走瓦隆叢林（ジャングル）到東部，在西邊死路附近靠近隱藏牆才會顯示銀之洞窟入口。","【深入洞窟】沿原版迷宮圖回收固定及隨機箱；注意警報陷阱與小房間的隱藏機關。","【最後通道】對付3隻プリマドンナ及4隻ヒトキノコ，別帶著破損武器與低LP硬闖。","【開門道具】前面寶箱含蟲糖戒指（虫アメの指輪）、漂亮石戒指（キレイ石の指輪），達成相關箱子條件後開門。","【深處頭目】擊退銀龍（シルバードラゴン）後往後方取命運石蛋白石（オパール）。","【重訪問題】若首次未擊敗銀龍又折返，可能遇到寶箱不再出現而門打不開的情況；原來源記載需再次出入／戰鬥才可能重新生成，但細節不明。"],"sources":["EV-16","KYO-EVENTS","FAQ-WALK","PS2-KYO-SILVER"],"tags":["命運石"],"stage":"壁虎族事件後","risk":"需迷宮能力，最深處挑戰銀龍取得蛋白石。","quality":"參照2005 PS2 原版事件資料及延續版本攻略細節整理；原站可能在2022後增修，已避開新增角色機制。","gallery":[]},{"id":"G035","section":"任務","title":"最終試煉","ja":"最終試練","summary":"蓋雷薩草原／太陽塔","steps":["在酒館聽詩人談話→前往草原西方的太陽塔→通過試煉。","原版玩家一輪三地參訪法：先取得詩人對應的地點情報，未完成全部條件之前不要隨便問出最終BOSS所在地。","當時玩家建議視信仰調整取得最終試煉、巨人村、冥府情報；具體神恩、陣法數值未經驗證，不列為固定公式。","太陽塔並不是加雷薩草原中央的環狀廣場；需向草原西側的畫面移動。","最終試煉中要打倒全部十二組頭目才能真正通過；無法當作普通寶箱迷宮中途退出。"],"sources":["EV-17","KYO-LAST","FAQ-EVENT","BH05-THREE","PS2-ALISATO-2005","PS2-KYO-FINAL"],"tags":["終局"],"stage":"100%起","risk":"巴哈2005為玩家經驗，不是官方神恩計算式，需另行查證。","quality":"已核對共通事件；進度條與新版便利功能不適用PS2","gallery":[]},{"id":"G036","section":"任務","title":"冥府","ja":"冥府","summary":"托瑪艾火山深處","steps":["【路線開啟】劇情進度到100%以上時，在酒館向吟遊詩人確認是否能取得冥府（冥府）情報；這與三地點信仰條件有關。","【前往火山】從傑爾頓（ジェルトン）所在里高島進托馬耶火山（トマエ火山），帶足跳躍技能使用次數。","【火神談判】到最深處向弗雷姆暴君（フレイムタイラント）對話，由其開啟冥府入口，這不是直接從世界地圖點擊冥府。","【冥府通路】穿過三途川（さんずのかわ），通路需要跳躍約12次；若地圖能力次數不足，事前就需回城準備。","【深入死神居所】冥府通路無一般隨機雜兵，依原版迷宮圖往最深處找到死神（デス）。","【最終情報】與死神對話選擇詢問沙魯因所在地，可啟動決戰沙魯因（決戦！サルーイン）事件。","【注意】打倒死神不等於玩家筆記自動判定冥府事件完成，特殊抉擇也可能影響隊伍、裝備或後續路線。"],"sources":["EV-18","KYO-LAST","FAQ-EVENT"],"tags":["終局"],"stage":"100%起・信仰條件","risk":"三個終局地點之一，向死神取得沙魯因情報。","quality":"參照2005 PS2 原版事件資料及延續版本攻略細節整理；原站可能在2022後增修，已避開新增角色機制。","gallery":[]},{"id":"G037","section":"任務","title":"古老之城","ja":"オールドキャッスル","summary":"烏索／巨人村","steps":["先符合三地點之一「古老之城」的吟遊詩人情報條件，於烏索聽村民提及巨人。","進入古城，調整龍頭方向啟動門；探索上層並分別打倒守衛。","完成機關後經大廳通道與井底前往巨人村，向村長詢問沙魯因所在。","從吟遊詩人聽到古老之城（オールドキャッスル）情報後，前往烏索向小孩詢問地點使古城出現。","探索古城機關，最後從井底通往巨人族村落；與冥府、最終試煉的信仰路線關聯。"],"sources":["KYO-LAST","FAQ-EVENT","FFSKY-2005-LATE","PS2-ALISATO-2005","BH05-THREE"],"tags":["終局"],"stage":"100%起・信仰條件","risk":"想在一輪探訪三地，必須先規劃各地情報取得順序；古城/冥府提前問出沙魯因所在地可能影響其他路線。","quality":"已核對共通事件；進度條與新版便利功能不適用PS2","gallery":[]},{"id":"G038","section":"任務","title":"決戰！沙魯因","ja":"決戦！サルーイン","summary":"伊斯瑪斯東洞窟／最終迷宮","steps":["【最終情報】在詩人提示中取得三地點之一資訊（最終試煉／冥府／古老之城），推進能得知沙魯因所在地的路線。","【事前存檔】回城分開保存正常通關與十石挑戰存檔，備妥全隊 HP／LP、術法、消耗型武器 EP。","【隊伍編制】至少一名回復主力及第二回復者、兩名前排護衛、支援隊員負責異常狀態及補給；避免全員只會單體高耗技。","【入口】由伊斯瑪斯往東邊洞窟到最終迷宮（ラストダンジョン），依地圖進入深處。","【第一形態】被擊倒可能遭アニメート干擾，保持活人數並控制 BP／EP 耗損。","【第二形態】心の闇與ヴォーテクス等攻擊會打亂防禦／狀態；盡量留有即時回復的人手。","【特殊強化】十顆命運石獻祭的真沙魯因強度不同，不是第一次通關的必做條件，也不可拿2022追加的極沙魯因規則套用。","【通關】勝利後看結局，其他主角、支線與不同抉擇可另開周目探索，沒有每位主角只需十步便完成所有內容的設定。"],"sources":["EV-19","KYO-LAST","BH-SARUIN","BH05-SARUIN"],"tags":["終局","高難度"],"stage":"三地點取得所在地後","risk":"強化王打法是單位玩家配裝心得，尚未自行實機重現。","quality":"以原版事件、原版樓層與時限來源整理；具進度或周目差異的選項會個別註明。","gallery":[]},{"id":"G039","section":"系統","title":"進度隱藏","ja":"シナリオ進行度（イベントランク）","summary":"PS2 版遊戲介面不顯示百分比。戰鬥勝利使事件點數逐步增加；可向「ギユウ軍」詢問新話題間接估算。","steps":["2005年PS2原版事件進度由戰鬥勝利所獲得的隱藏戰鬥點數決定，並非固定戰鬥「次數」或HP成長值。","完成戰鬥後，需要通過遊戲的「時間經過點」，事件開啟與消失才可能實際更新。","可藉ギユウ軍（義勇軍）的新對話，間接判定進度；PS2遊戲介面沒有數字進度條。","任務連鎖、主角與遊戲周目亦會影響發生條件；不能只看百分比表。"],"sources":["KYO-TIMING","KYO-RESEARCH","PS2-SURUME-EVENT"],"tags":["事件","進度"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G040","section":"系統","title":"閃悟","ja":"閃き","summary":"使用武器技時有機會閃出新招；敵人閃悟等級、武器模式、武器技能等均有影響。","steps":["遇到較強但可控的敵人，使用欲練武器反覆嘗試。","武器的 Attack / Defense / Trick 模式與派生表可調整效率。"],"sources":["KYO-SKILL","KYO-TECH"],"tags":["技","戰鬥"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G041","section":"系統","title":"BP / EP / LP","ja":"BP／EP／LP","summary":"BP 是戰鬥行動資源，EP 代表武器耐久消耗，LP 關係角色存活及復活代價。","steps":["不要只看 HP；高耗 EP 技術與低 LP 隊員都需要注意。","調整武器與職業可以減少某些消耗。"],"sources":["FAQ-WALK","KYO-CLASS"],"tags":["戰鬥"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G042","section":"系統","title":"職業與技能","ja":"クラス／スキル","summary":"職業需要對應技能等級認定，提升技能可影響行動與武器效率。","steps":["修練所先培養隊伍核心武器。","職業清單須只查原版項目；新版新增職業不可套用。"],"sources":["KYO-CLASS","FAQ-WALK"],"tags":["職業"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G043","section":"系統","title":"武器改造","ja":"武器補強","summary":"武器有不同模式與補強素材，搭配強度和耐久消耗。","steps":["先確定核心武器適合角色，再投入金錢與材料。","不要將新版調整後的數值當作原版數值。","2005巴哈：補強過的武器無法靠普通住宿恢復EP，需回鍛造屋維修；已裝上補強素材不可直接移除，只能改用其他素材覆蓋。"],"sources":["KYO-WEAPON","KYO-TECH","BH05-SHOPS"],"tags":["裝備"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G044","section":"系統","title":"地圖探索能力","ja":"マップアビリティ","summary":"潛行、開鎖、跳躍、尋寶、挖掘等能力會影響進路與寶箱。","steps":["進未知洞窟前準備探索技能，尤其高價寶箱或機關。","戰鬥進度趕時使用潛行減少不必要接戰。","2005巴哈：同隊有相同探索能力時採最高的技能等級，但使用回數合計全隊持有者次數。","像銀之洞窟需機關搜尋Lv1、水龍神殿精靈珠需跳躍Lv3；入迷宮前先確認能力與剩餘使用次數。"],"sources":["KYO-MAP","KYO-DUNGEON","BH05-SHOPS","KYO-MAP-ABILITY"],"tags":["地圖"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G045","section":"系統","title":"四天王任務鏈","ja":"四天王","summary":"水龍、阿迪利斯、泰尼費澤、弗雷姆泰倫特分別居於不同區域；任務互相牽連。","steps":["依原版四天王研究：水龍神殿接受委託 → 雨雲手鐲 → 疾風之靴 → 火神防禦輪 → 冰劍。","取得冰劍後通常依反方向交還任務道具，逐步解決後續交換。","部分道具可先從其他管道取得；是否仍能啟動交涉須留意事件旗標。","PS2原版交換鏈：水龍要求雨雲手鐲→阿迪利斯要求疾風之靴→泰尼費澤要求火神防禦輪→火焰暴君要求冰劍。","流程可以先接多個委託再回頭逐步交付；某些四天王另有戰鬥或種族調整分歧。"],"sources":["KYO-FOUR","KYO-EVENTS","PS2-SURUME-EVENT","BH05-FOUR"],"tags":["事件","四天王"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G046","section":"系統","title":"三地點信仰","ja":"三地点","summary":"100% 起，最終試煉／冥府／古城的提示受相關條件與神之信仰影響。","steps":["在觸發終局前保存備份，查看目前詩人講述哪個傳說。","不要假定一輪可自然見到三種提示。"],"sources":["KYO-LAST","BH-ADVICE"],"tags":["結局"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G047","section":"系統","title":"原版不繼承新版存檔規則","ja":"PS2版引継ぎ制限","summary":"2005 PS2 原版不能直接套用 2022 Remastered 的完整 NEW GAME+ 能力、裝備繼承功能。","steps":["攻略涉及周目時，先以 PS2 版可保留項目為準。","不要用新版「保留能力值／裝備」建議規劃原版二輪。"],"sources":["KYO-RESEARCH","BH-SARUIN"],"tags":["版本差異"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G048","section":"系統","title":"高難度真沙魯因","ja":"真サルーイン","summary":"PS2 原版可透過在終局獻出十顆命運石提高沙魯因強度。","steps":["這是可選挑戰，並非第一次破關必要條件。","可以參考巴哈 2026 年玩家的 PS2 專用實戰配裝心得。"],"sources":["BH-SARUIN","KYO-LAST"],"tags":["Boss","高難度"],"stage":"","risk":"","quality":"PS2 遊戲規則（外部資料交叉參照）","gallery":[]},{"id":"G049","section":"資料庫","title":"原版地圖與迷宮索引","ja":"マップ／ダンジョン","summary":"分類查看地區、地名開啟條件及迷宮地圖。","steps":["外站圖片保留原始出處，不另行下載重製。"],"sources":["KYO-MAP","KYO-DUNGEON"],"tags":["索引","原版"],"stage":"","risk":"不是本站全文轉載","quality":"來源已核對，未經實機測試","gallery":[]},{"id":"G050","section":"資料庫","title":"原版裝備與武器資料","ja":"武器／防具","summary":"武器種類、初始攻擊力、改造耐久、商店及技能連動資料。","steps":["已收錄9件2005原版具體武器資料，每筆包含攻擊性能、日文名稱、取得線索與本站自繪插圖。","打開「裝備資料」分類搜尋武器原名，從取得地點與配裝提示決定是否值得取得。","裝備插畫是本站自行繪製的器型示意，非遊戲截圖或官方立繪；未經核對的素材與隱藏數值不亂填。"],"sources":["KYO-WEAPON","FAQ-ARMOR"],"tags":["索引","原版"],"stage":"","risk":"不是本站全文轉載","quality":"來源已核對，未經實機測試","gallery":[]},{"id":"G051","section":"資料庫","title":"職業詳解與技能清單","ja":"クラス一覧","summary":"職業分基本、上級及傳說職業；原版資料可查修練場所。","steps":["部分新版職業頁已改版，細節需原版比對。"],"sources":["KYO-CLASS","FAQ-WALK"],"tags":["索引","原版"],"stage":"","risk":"不是本站全文轉載","quality":"來源已核對，未經實機測試","gallery":[]},{"id":"G052","section":"資料庫","title":"八主角劇情／同伴","ja":"主人公別初期イベント","summary":"八主角的開場、隊友加入及早期角色專屬事件索引。","steps":["可由主角卡片按來源查看完整路線。"],"sources":["KYO-CHAR","BH-CHAR"],"tags":["索引","原版"],"stage":"","risk":"不是本站全文轉載","quality":"來源已核對，未經實機測試","gallery":[]},{"id":"G053","section":"資料庫","title":"2005 全事件原始攻略","ja":"イベント FAQ","summary":"2005 年 Koul 誰だ…","summary":"涉及ダーク失落記憶、職業成長與煉獄；在 PS2 原版已存在。","steps":["先在前輪完成相關前置條件；後續周目使ダーク加入並觸發記憶事件。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"第二輪後・特殊條件","risk":"這是 2005 原有事件，不能和 2022 新增可加入角色混為一談。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G077","section":"任務","title":"火神防禦輪","ja":"火神防御輪","summary":"四天王交換鏈的中間品，與冰劍及疾風之靴相連。","steps":["在スカーブ山接取委託，循トマエ火山和冰劍路線取得防具，再返回交件。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可觸發、強敵區","risk":"四天王順序影響物品去向。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G078","section":"任務","title":"果樹園","ja":"果樹園","summary":"阿爾茲爾的農園／果園小型事件。","steps":["【前提】亞魯貝魯特已離開伊斯瑪斯城；或經相關人物加入／拒絕而令事件啟動。","【接觸】到阿爾茨爾（アルツール）街上向水果店店主打聽果樹園（果樹園）。","【第一次造訪】進果樹園查看園內作物狀態；開花期不用打怪，可直接返回阿爾茨爾。","【結果期】當果樹園處於結果期，把出沒的昆蟲怪物清除後返回水果店。","【重複】店主↔果樹園之間多次往返，花期→結果期→收穫期輪替；階段改變與劇情進度相關，不保證每趟都有新事件。","【收穫事件】收穫期可能出現洛蓮吉果實（ロレンジの実）收成挑戰，取得果實數量會影響獎勵。","【支線小物】果樹園的蜂巢偶爾能取得蜂蜜糖漿（ハニーシロップ）。","【報酬】經營成功使水果店售價下降；這項事件不會記錄在玩家筆記。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","NEW-KYO-ORCHARD"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"初期可接","risk":"事件名已在原版索引；詳細觸發尚待核。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G079","section":"任務","title":"刀之聲","ja":"刀の声","summary":"格雷主角與武士刀成長相關的長期事件。","steps":["草原の財宝與刀入手後，讓刀經過戰鬥培養並依提示追查。","前往里高島的草原東部財寶洞穴3F，尋找地面上的古刀（不是寶箱）。","古刀補強後需持續以該刀戰鬥累積成長，升級後回城取得下一補強提示；不必刻意打壞。","前期補強順序：青銅（傑爾頓）、ローザリア鋼（水晶城）、南方鉄（奧伊根施塔特）；之後等級的完整鍛材尚待逐一核對。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","BH05-KATANA","BH-MAP-SKILLS"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"格雷專屬","risk":"此處僅確認前期補強材料，後段Lv4～Lv7未逐項驗證，不列為完成表。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G080","section":"任務","title":"伊斯瑪斯城陷落！","ja":"陥落！イスマス城","summary":"亞魯貝特的序幕劇情，與東方怪物事件相接。","steps":["完成序章討伐後，返回伊斯瑪斯推進劇情至城堡陷落。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"亞魯貝特序章","risk":"主角限定、劇情會強制移動。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G081","section":"任務","title":"保護克洛蒂雅","ja":"クローディアを守れ","summary":"與克洛蒂雅出身及護衛相關的 PS2 初期事件。","steps":["原版事件索引明列，但所需主角、同伴及對話條件仍須再追一篇原版內頁。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"克洛蒂雅主線","risk":"索引已確認，細節待核實。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G082","section":"任務","title":"壁虎族","ja":"ゲッコ族","summary":"解救壁虎族的任務可銜接古文書及海賊銀的財寶。","steps":["ウェイプ酒館調查消息，前往叢林壁虎族村落，再折返武器店處理衝突。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可接","risk":"古文書前置。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G083","section":"任務","title":"凍結之城","ja":"凍りついた城","summary":"冰封城中的黑曜石之劍（オブシダンソード）事件。","steps":["前往凍結湖周邊；探索城堡並處理守護敵人，取得命運石相關武器。","蠟燭變色按照紅、綠、藍循環；將五支變成同一色開相應柵門，三色可用於不同門。","2005巴哈指出凍結湖妖精任務與沙漠地下尼薩神殿相關，先完成前置再回冰凍城。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","BH05-ICE","KYO-ICE-PUZZLE"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"後期・約110%","risk":"進度指內部參數，PS2 沒有百分比顯示。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G084","section":"任務","title":"古文書","ja":"古文書","summary":"古文書牽涉護符取得及皇帝奇病的月之神殿進入方法。","steps":["完成ゲッコ族後尋找古文書，查帝國圖書館，再蒐集アムト與エリス的象徵。","古文書提示雙月神殿入口需アムトのシンボル（北艾斯塔米爾神殿）與エリスのシンボル（迷途森林大樹）。","進行皇帝怪病前先取得象徵，降低迷宮內往返的風險。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","BH05-ALBERT","BH05-MID1"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可啟動・中期銜接","risk":"建議在皇帝の奇病進度窗前準備。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G085","section":"任務","title":"皇帝的怪病","ja":"皇帝の奇病","summary":"皇帝陷入怪病，需進入二つの月の神殿取得ムーンストーン。","steps":["【時限】2005 PS2 原版皇帝怪病通常需進度約45%後展開，70%前完成較保險。","【前置】處理壁虎族（ゲッコ族）取得古文書，再到梅爾維爾圖書館查讀。","【象徵一】北艾斯塔米爾阿姆特神殿取得アムトのシンボル。","【象徵二】到迷途森林取得エリスのシンボル，確認兩件象徵皆在隊伍。","【神殿入口】穿越叢林抵雙月神殿（二つの月の神殿），對照迷宮原圖 B1～B7 樓層。","【機關】每層指定敵種與地面機關有關，勿只往下走、跳過必要戰鬥。","【底層】擊敗ゾディアック，取得ムーンストーン（月亮石）。","【交差】返回梅爾維爾宮殿完成皇帝治病；若已超時，取得月石也不等於原事件正常完成。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","BH05-MID1","BH05-ALBERT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"45%起；70%附近風險","risk":"時限事件！過度戰鬥使劇情進度提高可能導致皇帝怪病未完成。","quality":"以原版事件、原版樓層與時限來源整理；具進度或周目差異的選項會個別註明。","gallery":[]},{"id":"G086","section":"任務","title":"疾風之靴","ja":"疾風の靴","summary":"四天王道具交換鏈，與火神防禦輪及雨雲手鐲互相依賴。","steps":["拜訪グレートピット與アディリス，循スカーブ山等地完成交換。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"早期可啟動、需跨區","risk":"需依任務鏈順序安排。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G087","section":"任務","title":"草原寶藏","ja":"草原の財宝","summary":"傑爾頓草原的早期尋寶事件，可取得武士刀等道具。","steps":["前往ジェルトン獲取草原線索，探索草原寶物洞穴、寶箱與守衛。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可接","risk":"戰鬥及遭遇暴龍前建議存檔。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G088","section":"任務","title":"凍結湖的妖精","ja":"凍結湖の妖精","summary":"凍結湖妖精相關任務，涉及沙漠地下水系。","steps":["在凍結湖接取，再探索カクラム砂漠及湖之村，完成妖精請求。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"後期約110%","risk":"末期出現，若錯過可於下輪處理。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G089","section":"任務","title":"尋找黃玉","ja":"トパーズを探せ","summary":"與塔拉爾族失蹤及大地之劍、命運石黃玉相關。","steps":["利用カクラム砂漠、沙漠遺跡和湖之村前往ニサ神殿。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"中期・沙漠探索","risk":"部分原版索引把此路線併入「タラール族消失」。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G090","section":"任務","title":"托馬耶火山的怪物","ja":"トマエ火山のモンスター","summary":"傑爾頓遭怪物侵襲，調查火山與フレイムタイラント。","steps":["與ジェルトン酒館人物交談，進入トマエ火山，調查最深處四天王。","2005巴哈：傑爾頓村中酒吧倖存者會告知火山所在，出發前帶跳躍能力。","火龍後方冥府入口不是單純擊敗火龍就能無條件進去；仍須滿足信仰與三地點情報條件。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","BH05-FIRE"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可接但強敵區","risk":"進入時機與敵人強度須評估。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G091","section":"任務","title":"被偷走的寧芙像","ja":"盗まれたニンフ像","summary":"在港口遇到マリーン NPC 並追查寧芙像。","steps":["於靠海城鎮尋找マリーン，追查南北エスタミル及下水道中的線索。","2005巴哈：港口城鎮可遇マリーン要求尋找寧芙像；到金礦協助持像男子護送至梅爾維爾神殿，夜間有怪物事件。","另一階段到北艾斯塔米爾酒館接近地下水道的線索，至地下三樓挑戰事件頭目。","PS2 舊研究特別提醒：事件後前往 North Point（ノースポイント）之前應先取得該地圖，避免部分原版環境的卡住／凍結風險。","啟動門檻約劇情進度 30%，並要注意同時期金礦襲擊事件是否已觸發。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","BH05-NYMPH","PS2-KYO-NYMPH"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"30%起・沿海城鎮","risk":"マリーン是 2005 原版 NPC；2022 才新增「可加入隊伍」，不能將本事件刪除。；PS2 舊資料提到 North Point 未解鎖時可能發生凍結，建議事先開出。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G092","section":"任務","title":"巴爾哈蘭怪物","ja":"バルハルモンスター","summary":"西芙早期、雪原村落的反覆討伐任務。","steps":["到ガトの村接受討伐，清除冰原相關洞穴的敵人。","在接受加特村報酬後，原版研究記載每再增加約5%可重開新段；超過32次等上限。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照","0%起、110%附近停止反覆受託"],"stage":"0%起、110%附近停止反覆受託","risk":"依主角／時期可能屬不同段落。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G093","section":"任務","title":"招來不幸的女人","ja":"不幸を呼ぶ女","summary":"PS2 原版即有シェリル的酒館敘事事件與光之鑽石取得過程。","steps":["【版本差異】此條先記 2005 PS2 原版；Remastered 對雪莉露出現回數與最短完成周目已有調整，不能把原版 12 次／至少3周套到 Remastered。","【開始】各地 PUB 遇到神祕女子雪莉露（シェリル）遭到騷擾，接近並交談。","【事件訊息】事件後酒館老闆可能說鬧事男子遇禍；這種對話有時當次重新進酒館就能觸發。","【下一次出現】前往其他城鎮 PUB 尋找雪莉露，記錄已碰面的次數；不是在同一 PUB 無限觸發。","【原版周目】PS2 原版總計需碰面12次，每周目最多5次，需將破關後存檔承接新周目，最短3周。","【任務終點】達成會面條件後進入命運石「光之鑽石（光のダイアモンド）」相關事件；詳細光鑽與黑暗宮殿支線請對照本條來源。","【可錯過】原版雪莉露在 PUB 的出現具有進度與場合限制，沒看到不能視為永久不存在，需檢查已觸發次數與是否過期。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","NEW-KYO-SHERIL"],"tags":["PS2 原版","2005 事件索引","日中對照","10%起多階段、60%後不再新增"],"stage":"10%起多階段、60%後不再新增","risk":"PS2 有シェリル NPC；2022 才追加她的隊友功能。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G094","section":"任務","title":"邊境地區毀滅","ja":"フロンティア壊滅","summary":"寶石獸活動可能導致ヤシ、サオキ與ウエストエンド受到破壞。","steps":["如未適時處理寶石獸，依事件進度調查被侵襲的邊境村鎮。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"後期・寶石獸分岔","risk":"不等於可逆轉所有被破壞村落。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G095","section":"任務","title":"魔之島","ja":"魔の島","summary":"探索邪惡魔法師所在島嶼的事件，可關聯命運石翡翠。","steps":["皇帝奇病後向ヨービル海岸附近打聽，再前往島上解機關。","為取得翡翠應先完成皇帝怪病、到梅爾維爾光之神殿聽情報並在限期內挑戰；只觸發島嶼不保證有翡翠。","原版2005巴哈：先完成皇帝怪病，再到梅爾維爾エロール神殿聽取魔之島情報。","去ヨービル港口搭委託船；島嶼原版只可造訪一次，出發前帶ワナ解除、カギ開け、ジャンプ。","避開光球，依序碰觸六個周邊控制點，抵達塔頂與ウェイ＝クビン交戰；若敵人逃走便無法取得エメラルド。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","BH05-MAGIC","PS2-KYO-MAGIC"],"tags":["PS2 原版","2005 事件索引","日中對照","自動後期約95%，翡翠有時限"],"stage":"自動後期約95%，翡翠有時限","risk":"PS2時限/一次性事件；在約95%後才去可能無法拿到翡翠，先備份進島前存檔。","quality":"PS2原版暫定事件研究；進度點受連鎖事件與時間經過點影響","gallery":[]},{"id":"G096","section":"任務","title":"木乃伊商人","ja":"ミイラ商人","summary":"協助行商者，途經多個城市，最後有渡船護送劇情。","steps":["北エスタミル酒館接受商人請求，追蹤旅途並協助海上事件。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可接","risk":"較長的跨城移動鏈。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G097","section":"任務","title":"怪物掃蕩","ja":"モンスター掃討","summary":"加特村接受洞窟清除委託，西芙可能加入。","steps":["依村長委託前往東南西洞窟處理固定怪物，返回加特。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"亞魯貝特序章後","risk":"PS2 原版序章，與バルハルモンスター名稱相近但不是任意合併。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G098","section":"任務","title":"讓怪物增加！野獸","ja":"モンスターを増やせ！(獣)","summary":"天鵝羽毛的生態系任務：提高野獸類怪物的相對順位。","steps":["【前置】先完成四天王委託「火神防禦輪（火神防御輪）」，將輪交給斯卡布山的提尼飛瑟。","【再次拜訪】回斯卡布山最深處找提尼飛瑟，接受增加獸系生態的要求。","【選擇獵物】需要增加獸系（獣）比例，因此去羅薩利亞地區擊倒「獸系以外」的怪物；伊斯瑪斯及海藍寶石洞窟也在統計區域內。","【避免無效戰鬥】只計算遭遇的主敵人圖示，不計算戰鬥中的隨從；逃跑不算成功狩獵。","【觀察排名】返回提尼飛瑟詢問斯卡布山各物種生息順位；尚未達標時繼續調整。","【交差】獸系生息順位達要求，再回報可得翼之槍（翼の槍）及 Jewel。","【Remastered 警告】後續周目的魔神附身四天王事件有額外時限，屬新版變更；PS2 版不要照搬新版 90% 取代條件。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","NEW-KYO-BEAST"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"四天王委託後","risk":"不是單純把所有非野獸怪打光。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G099","section":"任務","title":"讓怪物增加！昆蟲","ja":"モンスターを増やせ！(昆虫)","summary":"アディリス的生態調整任務，目標是提高昆蟲類排名。","steps":["【前置】先以和平方式完成「疾風之靴（疾風の靴）」並將疾風之靴交給阿迪利斯（アディリス），不可直接擊敗它取代交差。","【再次拜訪】到大坑（グレートピット）最深處找阿迪利斯，接受增加昆蟲（昆虫）數量的委託。","【調整生態】到維爾高原（ベイル高原）、大坑或梅爾維爾地下道，擊退昆蟲以外的敵種，降低其他族群比例。","【計算方式】敵人主圖示才算，戰鬥中附帶的小怪不另計，逃跑不計。","【查看趨勢】反覆和阿迪利斯交談確認高原的生息順位，達到要求再回報。","【報酬】完成可得大陸蛇之杖（大陸蛇の杖）與 Jewel。","【版本註】後周目90%以上魔神附身阿迪利斯是 Remastered 資料，不能當成2005 PS2固定條件。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","NEW-KYO-INSECT"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"四天王委託後","risk":"生態鏈具連動，別照固定怪物名單亂刷。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G100","section":"任務","title":"讓怪物增加！植物","ja":"モンスターを増やせ！(植物)","summary":"フレイムタイラント要求讓植物類成為優勢族群。","steps":["【前置】先完成「冰劍（アイスソード）」並把冰劍交給托馬耶火山的弗雷姆暴君（フレイムタイラント）。","【再次拜訪】深入托馬耶火山最深處與弗雷姆暴君交談，接受增加植物（植物）生態委託。","【調整生態】前往里高島草原，集中擊敗植物以外敵人，提升植物系在當地出現比例。","【統計注意】以遭遇敵人圖示為單位，戰鬥附帶的小怪不算；逃跑沒有減少他種。","【查詢】回火山向弗雷姆暴君詢問生態排名，未達標可繼續狩獵後再回報。","【報酬】完成後取得君主大斧（君主の大斧）及 Jewel。","【三地點影響】若吟遊詩人已說出冥府情報，可能需先詢問沙魯因所在地才能完成本次委託。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","KYO-FOUR"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"四天王委託後","risk":"原版英文 FAQ 關於目標種族有一處互相矛盾，採日文索引名稱為準。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G101","section":"任務","title":"讓怪物增加！水棲","ja":"モンスターを増やせ！(水棲)","summary":"水龍的生態調整任務，目標提高水棲怪物的相對排行。","steps":["【前置】在水龍神殿（「水竜の神殿」及「あまぐもの腕輪」）選擇符合允許水棲任務的分歧：交還雨雲手鐲、對話後離開，或挑戰水龍敗北；若打贏水龍則通常無法開啟。","【回神殿】再次訪問水龍，入口右邊的門會開啟；由此出入取得四顆水龍玉並安放神殿深處石像。","【要提高的族群】目標是瑪拉爾湖的水棲系（水棲）；到庫賈拉特地區擊敗水棲以外的怪物。","【適合地點】瑪拉爾湖多水棲、有翼和昆蟲系，可在艾斯塔米爾地下道或水龍神殿找其他敵種。","【不計入】只計遭遇的主怪物圖示，附帶小怪不算；逃跑不計。","【確認】再次與水龍交談，查閱生息順位；按排名變化決定是否繼續狩獵。","【報酬】完成取得水龍劍（水竜剣）與 Jewel。","【Remastered 警告】後周目90%後水龍可能被魔神附身，是新版條件，不能混用 PS2。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-SURUME-EVENT","NEW-KYO-AQUATIC"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"四天王委託後","risk":"完成可獲得水竜剣。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G102","section":"任務","title":"勇氣的證明","ja":"勇気の証","summary":"前往スカーブ山頂取回羽毛，認識タイニィフェザー。","steps":["【情報】到水晶城（クリスタルシティ）PUB 向酒客打聽斯卡布山的怪鳥。","【地名】若之前和奈特哈特（ナイトハルト）談過怪鳥之羽，可能直接取得斯卡布山（スカーブ山）位置。","【技能】入山前必須習得並裝備攀爬（クライミング）Lv2，確認可用次數。","【山頂】沿迷宮地形圖登頂，到提尼飛瑟（タイニィフェザー）的住處撿拾羽毛。","【主事件】取得タイニィフェザーの羽根後，「勇気の証」本身就算完成；不等於打倒四天王。","【後續選擇】和提尼飛瑟對話選願意聽取委託，可啟動火神防禦輪（火神防御輪）。","【連鎖分支】若先接受阿迪利斯的疾風之靴委託，會多出代為傳話的選項，可串起四天王交換鏈。","【另一分支】已有火神防禦輪可直接交付；選擇戰鬥則需準備對抗提尼飛瑟，應先分開存檔。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","NEW-KYO-COURAGE"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可接","risk":"相關委託需要爬山、敵人不弱。","quality":"2026-10-17 依原版與新版共同來源核對；2005 PS2 與 Remastered 新增條件已在內文分開標示。","gallery":[]},{"id":"G103","section":"任務","title":"妖精之森","ja":"妖精の森","summary":"收集五種精靈珠完成妖精王請求，可讓主角 LP 上限提高。","steps":["取得火、土、木、水等精靈珠後返回妖精之森祭壇，領取最後的精靈珠。","五顆珠：木の精霊珠（迷途森林）、火の精霊珠（托馬耶火山B4）、土の精霊珠（大坑B5）、水の精霊珠（水龍神殿B3）、金の精霊珠（集齊其他四顆後向妖精森林內指定妖精取得）。","原版資料稱未啟動妖精森林事件時精靈珠寶箱不會出現；水之珠還需特別留意水龍神殿事件階段。","回妖精森林五座台座放置精靈珠，啟動中央石頭完成任務。","妖精森林台座要先發光後，對應精靈珠寶箱才會出現。","妖精王任務完成後除了最大LP+2，還有每回合BP恢復量+1；水之珠可能被水龍神殿事件封路。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","BH05-FAIRY","KYO-FAIRY-ORIG"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"開場可接・中後期可完成","risk":"水之精靈珠受神殿開門及任務進展限制；2005文章描述存在分支差異，無法保證任何時間都能補拿。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G104","section":"任務","title":"路易的護衛","ja":"ルーイの護衛","summary":"協助ゴールドマイン的路易並處理遭襲事件。","steps":["在「盗まれたニンフ像」任務期間，前往ゴールドマイン找ルーイ護送。","先承接「被偷走的寧芙像」的瑪琳委託，然後在金礦和路易對話開啟護送。","護送往梅爾維爾住宿過夜時有事件戰鬥；完成護送再追查寧芙像去向。"],"sources":["KYO-EVENTS","KYO-TIME-LIST","FAQ-EVENT","PS2-KYO-NYMPH"],"tags":["PS2 原版","2005 事件索引","日中對照"],"stage":"30%起・寧芙像事件關聯","risk":"與被偷的寧芙像共享事件鏈。","quality":"PS2 事件名稱及大方向有原版史料；個別路徑尚待第二來源核實","gallery":[]},{"id":"G105","section":"資料庫","title":"左手劍｜攻擊性能 45","ja":"レフトハンドソード","summary":"長劍；最終試煉取得。","steps":["武器名：レフトハンドソード；主 :[]},{"id":"G124","section":"資料庫","title":"巴哈姆特 PS2｜金手指歷年索引","ja":"改造コード／アイテム","summary":"包含金手指 1／2、全技能、狀態最大、物品、任務啟動及奧義相關文章；不等於代碼逐項已驗。","steps":["巴哈精華區總索引「PS2／吟遊詩人之歌」原分區。逐篇內容因 HTTP 403 存取限制仍待核實。"],"sources":["BH-INDEX"],"tags":["巴哈姆特","精華區","2005 PS2","文章索引"],"stage":"來源清單","risk":"搜尋索引顯示存在，不代表取得全文或核對可用性。","quality":"已核對巴哈 PS2 專版索引標題","gallery":[]},{"id":"G125","section":"資料庫","title":"巴哈姆特 PS2｜站外攻略","ja":"攻略リンク","summary":"包含日本 PS2 攻略站與 A9VG 八主角攻略歷史索引；尚未全部逐內鏈取得。","steps":["巴哈精華區總索引「PS2／吟遊詩人之歌」原分區。逐篇內容因 HTTP 403 存取限制仍待核實。"],"sources":["BH-INDEX"],"tags":["巴哈姆特","精華區","2005 PS2","文章索引"],"stage":"來源清單","risk":"搜尋索引顯示存在，不代表取得全文或核對可用性。","quality":"已核對巴哈 PS2 專版索引標題","gallery":[]},{"id":"MAP-01","section":"地圖","title":"邊境","ja":"フロンティア","summary":"區域地理／主要地點：西端（ウエストエンド）、雅西開拓村、紹基開拓村","steps":["地圖開啟：芭芭拉入隊，或從新道路北端抵達西端後詢問村落情報。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；邊境在大陸的位置可與周圍區域比較。","【新道路｜ニューロード】通往西端等邊境城鎮。芭芭拉入隊，或依吟遊詩人、妖精森林／寶石獸相關資訊開啟。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【雅西洞窟｜ヤシの洞窟】開拓村誘拐事件。先在雅西開拓村聽到誘拐情報，再追蹤到洞窟。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【紹基洞窟｜サオキの洞窟】紹基的魔物。紹基開拓村取得消息後進入；有高等級地圖技能需求，可能需要回訪。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【吸血鬼洞窟｜ヴァンパイアの洞窟】吸血鬼復活。在西端 PUB 蒐集吸血鬼傳聞開啟。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【寶石獸洞窟｜ジュエルビースト】寶石獸／邊境地區毀滅。可由暗殺者公會或水棲怪物調整任務探得位置；洞窟能否進入與怪獸甦醒時程分開判斷。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-01","KYO-MAP"],"tags":["地圖","地區","2005 PS2","フロンティア"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_1.html"},{"id":"MAP-02","section":"地圖","title":"庫賈拉特","ja":"クジャラート","summary":"區域地理／主要地點：南艾斯塔米爾、塔爾米塔、馬拉爾湖","steps":["地圖開啟：傑米爾／芭芭拉入隊，或從北艾斯塔米爾搭船；塔爾米塔可由水龍事件解鎖。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；庫賈拉特在大陸的位置可與周圍區域比較。","【塞克特宮殿｜セケト宮殿】水龍神殿。塔爾米塔夜間水位退下後，從階梯前往地下並追查偽太守。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【水龍神殿｜水竜の神殿】水龍神殿／雨雲手鐲／增加水棲怪。在馬拉爾湖取船前往，往最深處追查失蹤少女，之後可能承接雨雲手鐲連鎖任務。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【暗殺者公會｜アサシンギルド】暗殺者公會。南艾斯塔米爾接任、旅館遭襲後獲得地點；內部沿發光方向依序走出路線，避免岔往與 Dark 有關的祭壇。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【艾斯塔米爾下水道｜エスタミル地下道】木乃伊商人／吸血鬼／暗殺公會。北南艾斯塔米爾可透過下水道移動；部分任務藏有入口。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-02","KYO-MAP"],"tags":["地圖","地區","2005 PS2","クジャラート"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_2.html"},{"id":"MAP-03","section":"地圖","title":"羅薩利亞","ja":"ローザリア","summary":"區域地理／主要地點：水晶城、阿爾茲爾、北艾斯塔米爾","steps":["地圖開啟：亞魯貝特／希芙／格雷／芭芭拉等入隊，或由其他港口轉船與 NPC 消息。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；羅薩利亞在大陸的位置可與周圍區域比較。","【水晶湖｜クリスタルレイク】搜尋海藍寶石。需透過任務取得海藍寶石相關線索，再從湖區進入洞窟。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【斯卡布山｜スカーブ山】勇氣之證／疾風之靴。水晶城酒館可得山名；登頂調查巨鳥羽毛，引出四天王相關委託。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【魔之島｜魔の島】魔之島。只能前往一次；提前清出道具空格、準備解陷與開鎖再上島（2005巴哈攻略提醒）。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【伊斯瑪斯東洞窟｜イスマス東の洞窟】伊斯瑪斯東方怪物。亞魯貝特開場清除東洞窟怪物。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【伊斯瑪斯城遺址｜イスマス城（崩壊時）】伊斯瑪斯陷落／決戰沙魯因。需區分主角序章的城堡與後期返回時的崩壞狀態。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-03","KYO-MAP"],"tags":["地圖","地區","2005 PS2","ローザリア"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_3.html"},{"id":"MAP-04","section":"地圖","title":"乾燥地帶","ja":"ドライランド","summary":"區域地理／主要地點：北角、烏索、加雷薩草原、卡克拉姆沙漠","steps":["地圖開啟：從北角詢問前往烏索、從烏索詢問草原，或愛夏入隊；從草原北西到沙漠。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；乾燥地帶在大陸的位置可與周圍區域比較。","【加雷薩草原｜ガレサステップ】塔拉爾族消失／靈魂吸取者／最終試煉。從烏索取得情報或愛夏入隊開啟草原。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【卡克拉姆沙漠｜カクラム砂漠】塔拉爾族消失／黃玉。從草原西北入口進入；透過流沙方向進入沙漠中央。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【沙漠地下尼薩神殿｜カクラム砂漠中央部～ニーサの神殿】塔拉爾族消失／黃玉。沙漠中央由流沙／遺跡向地下探索，通往尼薩神殿。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【最終試煉｜最終試練】三地點之一：最終試煉。劇情進度到達後，由吟遊詩人說出最終試煉線索；和冥府、古老之城條件分開確認。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【古老之城｜オールドキャッスル】三地點之一：古老之城。烏索聽完線索進入古城；調整三座龍頭機關開門，擊敗三名守衛後由井底通往巨人村。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-04","KYO-MAP"],"tags":["地圖","地區","2005 PS2","ドライランド"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_4.html"},{"id":"MAP-05","section":"地圖","title":"騎士團領","ja":"騎士団領","summary":"區域地理／主要地點：米爾札布爾、奧伊根施塔特、拜澤爾海姆","steps":["地圖開啟：希芙入隊或搭船至米爾札布爾；與當地騎士交談開啟委託與迷宮。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；騎士團領在大陸的位置可與周圍區域比較。","【要塞遺跡｜砦跡】騎士團的榮耀。騎士團會議同意參戰，或從米爾札布爾港口人士取得遺跡資訊。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【康斯坦茲｜コンスタンツ】康斯坦茲遭綁架。經拜澤爾海姆的弗拉瑪取得線索才會開啟迷宮。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【米爾札布爾城內｜ミルザブール城内】提奧多爾失常。相關城堡事件結束後回頭開寶箱通常更容易（2005 巴哈玩家心得）。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【邪教廢墟｜邪教の廃墟】提奧多爾失常。調查提奧多爾房間的便條後取得入口情報。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【龍之谷｜竜の谷】傳說的龍騎士。提奧多爾任務完成且隊伍未滿5人時，回奧伊根施塔特城與騎士接洽。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-05","KYO-MAP"],"tags":["地圖","地區","2005 PS2","騎士団領"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_5.html"},{"id":"MAP-06","section":"地圖","title":"巴爾哈蘭特","ja":"バルハラント","summary":"區域地理／主要地點：加托村、雪原","steps":["地圖開啟：希芙入隊取得雪原；部分主角事件可由船難等途徑抵達。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；巴爾哈蘭特在大陸的位置可與周圍區域比較。","【巴爾哈蘭特雪原｜バルハラント・フィールド】巴爾哈蘭怪物／凍結湖妖精。希芙入隊可得雪原；移動加托村通常必須經雪原地區。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【東之洞窟｜東の洞窟】巴爾哈蘭怪物。2005 巴哈攻略註記有一名小頭目。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【西之洞窟｜西の洞窟】巴爾哈蘭怪物。同一系列委託，和南之洞窟不同階段區分。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【南之洞窟｜南の洞窟】巴爾哈蘭怪物。地圖依進展分成三個階段，第三階段西南不定系頭目容易漏掉。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【凍結湖／冰凍城｜凍結湖／凍りついた城】凍結湖妖精／冰封城。與110%進度條件有關，入城尋找黑曜石之劍。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-06","KYO-MAP"],"tags":["地圖","地區","2005 PS2","バルハラント"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_6.html"},{"id":"MAP-07","section":"地圖","title":"巴法爾帝國","ja":"バファル","summary":"區域地理／主要地點：梅爾維爾、金礦鎮、迷途森林、羅班","steps":["地圖開啟：格雷／克洛蒂雅入隊可獲得常用地名，也可由傑爾頓等港口搭船。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；巴法爾帝國在大陸的位置可與周圍區域比較。","【梅爾維爾下水道｜メルビル下水道】旅館女兒與怪死／梅爾維爾襲擊計畫。襲擊任務之前可在地下查明海賊據點，後期事件另有地下神殿。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【伊莉莎白宮殿｜メルビル・エリザベス宮殿】梅爾維爾襲擊計畫。後期海賊襲擊與宮殿Boss事件，勿與早期金礦襲擊混淆。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【迷途森林（白天）｜迷いの森（昼）】貓頭鷹的呼喚／皇帝的怪病。依序參照女巫、森林事件；白天與夜晚路線及寶物不同。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【迷途森林（夜晚）｜迷いの森（夜）】迷途蝴蝶。追著蝴蝶進入夜間森林，取得骷髏墜飾與夜光草並返回委託人。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【金礦礦坑｜ゴールドマイン（鉱山）】金礦襲擊／礦山襲擊。早期與後期兩個同名襲擊事件需要分開標示。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【羅班公館地下｜ローバーン公屋敷地下】尼維爾的委託。需要先接取相關情報方能進入。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【維爾高原｜ベイル高原】雨雲手鐲。高原通往大坑，可能由藍埃雷港口居民取得線索。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【大坑｜グレートピット】雨雲手鐲／疾風之靴。由高原進入螺旋式迷宮，踏機關開門，底部見阿迪利斯討論四天王交換條件。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":
