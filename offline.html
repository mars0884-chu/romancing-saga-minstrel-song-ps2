未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_9.html"},{"id":"MAP-10","section":"地圖","title":"里高島","ja":"リガウ島","summary":"區域地理／主要地點：傑爾頓、草原、托馬耶火山","steps":["地圖開啟：格雷初期據點，島內草原與火山情報由居民及任務取得。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；里高島在大陸的位置可與周圍區域比較。","【草原洞穴｜草原～草原の穴】草原寶藏。由草原洞口進入；每層恐龍蛋可能依戰鬥勝利數決定是否出現。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【恐龍洞穴｜恐竜の穴】草原寶藏／恐龍蛋。草原洞穴及恐龍洞穴相關，須避免把兩個區域混成一張地圖。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【財寶洞穴｜財宝の穴】草原寶藏。2005 巴哈指出部分通路須使用高等級跳躍與攀爬。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【托馬耶火山｜トマエ火山】火山怪物／冰劍／火神防禦輪／冥府。通往四天王火焰暴君與冥府入口，需區分完成四天王條件與三地點的信仰條件。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【冥府｜冥府】三地點之一：冥府。經托馬耶火山與火焰暴君交涉後前往死神處；同伴LP與選項後果須提示。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-10","KYO-MAP"],"tags":["地圖","地區","2005 PS2","リガウ島"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_10.html"},{"id":"MAP-11","section":"地圖","title":"特殊地區","ja":"その他の地域","summary":"區域地理／主要地點：妖精森林、冥府、煉獄、黑暗宮殿、最終迷宮","steps":["地圖開啟：透過指定事件與路線解鎖，部分跨周目特殊事件亦屬原版。","【世界定位】圖片為2005攻略站實際世界區域圖（並非遊戲中地圖截圖）；特殊地區在大陸的位置可與周圍區域比較。","【木乃伊商船｜ミイライベントの商船】木乃伊商人。部分事件可能由商船戰鬥接至妖精森林。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【烏科姆海底神殿｜ウコムの海底神殿】烏科姆海底神殿。地圖索引指出第1～3樓有隨機寶箱；第4樓固定取得黑鑽石。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【妖精森林｜妖精の森】妖精森林。原版特殊地圖，可因紫水晶或木乃伊商船事件開啟。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【煉獄｜煉獄】我到底是誰（Dark）。跨周目原版Dark支線，需與2022新增任務區分。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【黑暗宮殿｜闇の宮殿】招來不幸的女人（謝麗爾）。PS2原版存在；不要因與Remastered角色有關而誤排除整項原版任務。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【最終迷宮｜ラストダンジョン】決戰沙魯因。由原版三地點取得所在地後進入伊斯瑪斯關聯終章。。完整寶箱、機關、需求與原始迷宮圖可用這個中文或日文名稱搜尋。","【開啟城鎮】地名需經主角、PUB情報或前置任務才會出現在世界地圖；依上面迷宮條目逐項處理。"],"sources":["KYO-DUN-11","KYO-MAP"],"tags":["地圖","地區","2005 PS2","その他の地域"],"stage":"世界地圖／地點解鎖","risk":"混合版本網站僅採2005年已有的地點及事件；特定條件仍應對照原版史料。","quality":"本區圖為原版攻略站實際地理圖片，內容按原版地點索引整理；不是自行生成，也不是遊戲中的原始UI截圖。","gallery":[{"src":"https://kyokugen.info/minsaga/pic/13853.jpg","caption":"2005 年原版攻略的真實世界地區位置地圖（極限攻略原站直接連結；不是本站製作）。本站未保存原圖，離線不提供。"}],"mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_11.html"},{"id":"D-01-01","section":"迷宮","title":"新道路","ja":"ニューロード","summary":"通往西端等邊境城鎮。芭芭拉入隊，或依吟遊詩人、妖精森林／寶石獸相關資訊開啟。","steps":["地圖技能：藥草搜尋、採集。","關聯事件：通往西端等邊境城鎮。","進入與探索：芭芭拉入隊，或依吟遊詩人、妖精森林／寶石獸相關資訊開啟。"],"sources":["KYO-DUN-01","BH-MAP-SKILLS","PS2-MAP-FRONTIER_NEWROAD"],"tags":["迷宮","地圖技能","ニューロード","01","2005 PS2"],"stage":"邊境","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/frontier_newroad.jpeg","caption":"ニューロード｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_1_04.html"},{"id":"D-01-02","section":"迷宮","title":"雅西洞窟","ja":"ヤシの洞窟","summary":"開拓村誘拐事件。先在雅西開拓村聽到誘拐情報，再追蹤到洞窟。","steps":["進入口：雅西開拓村，先向吟遊詩人旁的女性打聽洞窟，再往洞內探索。","B1 固定可取得地圖；B2 有 100 金＋Jewel 及 500 金＋Jewel 的固定寶箱。","建議寶箱搜尋 Lv1：B1～B2 的部分隨機寶箱才會顯示，並可能重新出現。","【取得入口】在雅西開拓村向吟遊詩人旁女性打聽誘拐情報，再進雅西洞窟（ヤシの洞窟）。","【B1 地圖】進入 B1，固定位置可取得洞窟地圖，先拿再分辨上下層出口。","【B2 固定箱】B2 有固定的 100 金＋Jewel、500 金＋Jewel；依原圖箱位依序收集。","【可選探索】寶箱搜尋（宝箱サーチ）Lv1 至少備 2 次才能發現部分隨機寶箱。","【戰鬥事件】循原圖 BOSS 標記追查誘拐事件敵人；擊敗後返回開拓村完成事件。","【注意】可再出現的隨機箱不能當作一次性的固定箱；過度打怪可能推進事件而錯失期限。"],"sources":["KYO-DUN-01","BH-MAP-SKILLS","PS2-KYO-YASHI"],"tags":["迷宮","地圖技能","ヤシの洞窟","01","2005 PS2"],"stage":"邊境","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"依 2005 PS2 原版地圖舊資料逐層整理；原站可能有 Remastered 後續修訂，註明固定／隨機條件。","gallery":[{"src":"https://kyokugen.info/minsaga/map/frontier_yassi.jpeg","caption":"ヤシの洞窟｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_1_05.html","landmarks":[{"floor":"B1","type":"固定","item":"地圖","note":"雅西洞窟地下1層。"},{"floor":"B2","type":"固定","item":"100金＋Jewel","note":"固定箱。"},{"floor":"B2","type":"固定","item":"500金＋Jewel","note":"固定箱。"},{"floor":"B1／B2","type":"隨機","item":"可重生的金錢／裝備箱","note":"寶箱搜尋Lv1。"}]},{"id":"D-01-03","section":"迷宮","title":"紹基洞窟","ja":"サオキの洞窟","summary":"紹基的魔物。紹基開拓村取得消息後進入；有高等級地圖技能需求，可能需要回訪。","steps":["【地圖開啟】在紹基開拓村（サオキ開拓村）詢問魔物事件，再到紹基洞窟（サオキの洞窟）。","【準備技能】跳躍Lv3 5次、攀爬Lv3 12次、寶箱搜尋Lv1 4次、解除陷阱Lv2 3次；可另備採礦。","【B1 固定箱】優先取洞窟地圖與護甲プロテクター（後者需要寶箱搜尋Lv1）。","【B2 固定箱】依原圖通路往下層，可收500金＋Jewel。","【B3 固定箱】最深處有700金＋隨機武器，武器種類會變。","【B1～B3 隨機箱】最多三組200金＋隨機防具／Jewel，需寶箱搜尋Lv1，陷阱隨機且可能再生，與固定箱分開。"],"sources":["KYO-DUN-01","BH-MAP-SKILLS","PS2-MAP-FRONTIER_SAOKI"],"tags":["迷宮","地圖技能","サオキの洞窟","01","2005 PS2"],"stage":"邊境","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/frontier_saoki.jpeg","caption":"サオキの洞窟｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_1_06.html","landmarks":[{"floor":"區域待核","type":"機關","item":"跳躍Lv3 5次、攀爬Lv3 12次、寶箱搜尋Lv1 4次、解除陷阱Lv2 3次；可另備採礦。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B1","type":"攻略提示","item":"優先取洞窟地圖與護甲プロテクター（後者需要寶箱搜尋Lv1）。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B2","type":"攻略提示","item":"依原圖通路往下層，可收500金＋Jewel。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B3","type":"隨機","item":"最深處有700金＋隨機武器，武器種類會變。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B1","type":"機關","item":"最多三組200金＋隨機防具／Jewel，需寶箱搜尋Lv1，陷阱隨機且可能再生，與固定箱分開。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-01-04","section":"迷宮","title":"吸血鬼洞窟","ja":"ヴァンパイアの洞窟","summary":"吸血鬼復活。在西端 PUB 蒐集吸血鬼傳聞開啟。","steps":["【開啟洞窟】先到西端（ウエストエンド）PUB 聽吸血鬼復活（ヴァンパイア復活）情報。","【準備】建議寶箱搜尋Lv2 2次、解除陷阱5次；解除陷阱所需Lv會隨劇情進度上升。","【B1】固定10金箱有隨機陷阱，不要把低額金錢當成完全安全的箱。","【B2】可取固定20金＋骨胸甲、50金＋骨胸甲；還有40金＋Jewel、カイラルの木靴，後兩箱涉及警報陷阱。","【B1～B3】寶箱搜尋Lv2可發現部分300金＋骨胸甲、100金＋隨機防具／Jewel箱；位置隨機、可能再生。","【B4】固定地圖寶箱帶遭遇型陷阱（エンカウンター），建議優先處理後再往頭目區。","【戰鬥】深處吸血鬼戰先準備回復及對不死系攻擊手段，避免長戰耗盡LP與武器EP。"],"sources":["KYO-DUN-01","BH-MAP-SKILLS","PS2-MAP-FRONTIER_VAMPIRE"],"tags":["迷宮","地圖技能","ヴァンパイアの洞窟","01","2005 PS2"],"stage":"邊境","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/frontier_vampire.jpeg","caption":"ヴァンパイアの洞窟｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_1_07.html","landmarks":[{"floor":"區域待核","type":"機關","item":"建議寶箱搜尋Lv2 2次、解除陷阱5次；解除陷阱所需Lv會隨劇情進度上升。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B1","type":"機關","item":"固定10金箱有隨機陷阱，不要把低額金錢當成完全安全的箱。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B2","type":"機關","item":"可取固定20金＋骨胸甲、50金＋骨胸甲；還有40金＋Jewel、カイラルの木靴，後兩箱涉及警報陷阱。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B1","type":"隨機","item":"寶箱搜尋Lv2可發現部分300金＋骨胸甲、100金＋隨機防具／Jewel箱；位置隨機、可能再生。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B4","type":"頭目","item":"固定地圖寶箱帶遭遇型陷阱（エンカウンター），建議優先處理後再往頭目區。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-01-05","section":"迷宮","title":"寶石獸洞窟","ja":"ジュエルビースト","summary":"寶石獸／邊境地區毀滅。可由暗殺者公會或水棲怪物調整任務探得位置；洞窟能否進入與怪獸甦醒時程分開判斷。","steps":["【地點情報】完成暗殺者公會，或完成「讓水棲怪增加」（モンスターを増やせ！水棲）後取得寶石獸情報。","【時程注意】原站記載暗殺者公會到75%以上才結束可能不會直接出現洞窟地名，別錯把頭目甦醒條件當成地名解鎖。","【必須能力】跳躍Lv1至少2次、攀爬至少8次；攀爬需考慮去回雙程。","【地下洞】大御柱結界洞有固定地圖，先取得再走崩落大御柱。","【崩柱頂端】來源列兩組3000金＋Jewel與ジュエルリング，固定候選點但箱是否出現仍有隨機條件。","【背面出口】寶石獸即使在睡眠狀態也可能封住後門，要先準備回程探索技能。","【頭目】寶石獸是高難度敵人，開戰前保留存檔、安排補師與抗性，首次造訪不必硬拚。"],"sources":["KYO-DUN-01","BH-MAP-SKILLS","PS2-MAP-FRONTIER_JEWELBEAST"],"tags":["迷宮","地圖技能","ジュエルビースト","01","2005 PS2"],"stage":"邊境","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/frontier_jewelbeast.jpeg","caption":"ジュエルビースト｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_1_08.html","landmarks":[{"floor":"區域待核","type":"頭目","item":"原站記載暗殺者公會到75%以上才結束可能不會直接出現洞窟地名，別錯把頭目甦醒條件當成地名解鎖。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"區域待核","type":"頭目","item":"寶石獸是高難度敵人，開戰前保留存檔、安排補師與抗性，首次造訪不必硬拚。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-02-01","section":"迷宮","title":"塞克特宮殿","ja":"セケト宮殿","summary":"水龍神殿。塔爾米塔夜間水位退下後，從階梯前往地下並追查偽太守。","steps":["地圖技能：尚待確認。","關聯事件：水龍神殿。","進入與探索：塔爾米塔夜間水位退下後，從階梯前往地下並追查偽太守。"],"sources":["KYO-DUN-02","PS2-MAP-KJARAGT_TARMITTA"],"tags":["迷宮","地圖技能","セケト宮殿","02","2005 PS2"],"stage":"庫賈拉特","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/kjaragt_tarmitta.jpeg","caption":"セケト宮殿｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_2_06.html"},{"id":"D-02-02","section":"迷宮","title":"水龍神殿","ja":"水竜の神殿","summary":"水龍神殿／雨雲手鐲／增加水棲怪。在馬拉爾湖取船前往，往最深處追查失蹤少女，之後可能承接雨雲手鐲連鎖任務。","steps":["2005巴哈：水之精靈珠位於水龍神殿B3，玩家提到需跳躍與某段事件進度，先於神殿任務期間檢查。","牽涉女兒失蹤事件、四天王交換及妖精森林精靈珠，安排水龍事件前先列好後續目標。","神殿 B1～B3 分散水龍的赤玉、綠玉、黃玉、青玉；四顆玉用於深處開門。","水龍瀑布入口是限時可進的區域：若先把四玉裝好開門、或打倒水龍，會失去某些瀑布通道；先處理瀑布寶物再鎖定深處流程。","取得妖精森林的水之精靈珠須用跳躍 Lv3；寶箱位於 B3，還要留意水龍任務的關門條件。","【乘船入口】塔爾米塔（タルミッタ）推進「水竜の神殿」事件，從馬拉爾湖搭船到水龍神殿。","【必須能力】準備跳躍（ジャンプ）Lv3、至少6次；建議寶箱搜尋 Lv2 至少3次、解除陷阱與開鎖各2次。","【地下 B1】先回收固定地圖，並留意通往水龍瀑布的期間限定路線。","【瀑布】水龍瀑布有固定紅玉（赤玉）；過早裝妥四玉或打倒水龍將無法再進，這是最重要的不可逆路線。","【地下 B2】收集綠玉（緑玉）與黃玉（黄玉），確認各樓層相連的通道與回程出口。","【地下 B3】拿藍玉（青玉）與水之精靈珠（水の精霊珠；妖精森林任務），再處理四玉機關。","【寶箱辨識】瀑布／B3 的武器、金錢、精靈石之杖可能是隨機箱；不要誤當作每次固定取得。","【重要分歧】水龍的委託與是否擊敗水龍會改變開門及瀑布條件，做選擇前獨立存檔。"],"sources":["KYO-DUN-02","BH-MAP-SKILLS","PS2-GOR-WATER","FFSKY-2005-LATE","BH05-FAIRY","KYO-WATER-PUZZLE","KYO-FAIRY-ORIG"],"tags":["迷宮","地圖技能","水竜の神殿","02","2005 PS2"],"stage":"庫賈拉特","risk":"關鍵可錯過：先檢查水龍瀑布與水之精靈珠，再完成四玉開門或打倒水龍。","quality":"依 2005 PS2 原版地圖舊資料逐層整理；原站可能有 Remastered 後續修訂，註明固定／隨機條件。","gallery":[{"src":"https://kyokugen.info/minsaga/map/kjaragt_shuilung.jpeg","caption":"水竜の神殿｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_2_07.html","landmarks":[{"floor":"B1","type":"固定","item":"地圖","note":"地下1層固定地圖位置；依原圖入口與水龍瀑布入口區分。"},{"floor":"水龍瀑布","type":"固定","item":"水龍赤玉（水竜の赤玉）","note":"限時可進；四玉全部裝上或打倒水龍後可能封路。"},{"floor":"B2","type":"固定","item":"水龍綠玉（水竜の緑玉）","note":"地下2層的固定寶玉。"},{"floor":"B2","type":"固定","item":"水龍黃玉（水竜の黄玉）","note":"地下2層另一顆固定寶玉。"},{"floor":"B3","type":"固定","item":"水龍青玉（水竜の青玉）","note":"地下3層固定寶玉。"},{"floor":"B3","type":"固定","item":"水之精靈珠（水の精霊珠）","note":"妖精森林任務，需跳躍Lv3。"},{"floor":"瀑布／B3","type":"隨機","item":"金錢＋Jewel／武器／精靈石杖","note":"需寶箱搜尋，陷阱與箱位隨機；不是每次固定出現。"},{"floor":"深處","type":"機關","item":"四顆水龍玉（赤・緑・黄・青）","note":"依原版地圖放入四玉開門，會影響瀑布回訪。"}]},{"id":"D-02-03","section":"迷宮","title":"暗殺者公會","ja":"アサシンギルド","summary":"暗殺者公會。南艾斯塔米爾接任、旅館遭襲後獲得地點；內部沿發光方向依序走出路線，避免岔往與 Dark 有關的祭壇。","steps":["地圖技能：解除陷阱。","關聯事件：暗殺者公會。","進入與探索：南艾斯塔米爾接任、旅館遭襲後獲得地點；內部沿發光方向依序走出路線，避免岔往與 Dark 有關的祭壇。"],"sources":["KYO-DUN-02","BH-MAP-SKILLS","PS2-GOR-ASSASSIN","FFSKY-2005-LATE","KYO-WATER-PUZZLE"],"tags":["迷宮","地圖技能","アサシンギルド","02","2005 PS2"],"stage":"庫賈拉特","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/kjaragt_assassin.jpeg","caption":"アサシンギルド｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_2_07.html","landmarks":[{"floor":"區域待核","type":"機關","item":"地圖技能：解除陷阱。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-02-04","section":"迷宮","title":"艾斯塔米爾下水道","ja":"エスタミル地下道","summary":"木乃伊商人／吸血鬼／暗殺公會。北南艾斯塔米爾可透過下水道移動；部分任務藏有入口。","steps":["地圖技能：寶箱搜尋Lv3、跳躍Lv2、解除陷阱、開鎖。","關聯事件：木乃伊商人／吸血鬼／暗殺公會。","進入與探索：北南艾斯塔米爾可透過下水道移動；部分任務藏有入口。","B1：有固定地圖與 Jewel；若要找 1000 金的寶箱，準備寶箱搜尋 Lv3。","B2：部分箱有機關或鎖，宜備解除陷阱 Lv1、開鎖；另有橡膠鞋（ラバーソウル）寶箱。","B3：藏有細劍「シルバーフルーレ」；別把不同層的暗殺公會支線入口混在一起。"],"sources":["KYO-DUN-02","BH-MAP-SKILLS","PS2-KYO-ESTAMIR"],"tags":["迷宮","地圖技能","エスタミル地下道","02","2005 PS2"],"stage":"庫賈拉特","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/kjaragt_estamir.jpeg","caption":"エスタミル地下道｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_2_05.html","landmarks":[{"floor":"區域待核","type":"機關","item":"地圖技能：寶箱搜尋Lv3、跳躍Lv2、解除陷阱、開鎖。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B1","type":"攻略提示","item":"B1：有固定地圖與 Jewel；若要找 1000 金的寶箱，準備寶箱搜尋 Lv3。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B2","type":"機關","item":"B2：部分箱有機關或鎖，宜備解除陷阱 Lv1、開鎖；另有橡膠鞋（ラバーソウル）寶箱。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B3","type":"攻略提示","item":"B3：藏有細劍「シルバーフルーレ」；別把不同層的暗殺公會支線入口混在一起。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-03-01","section":"迷宮","title":"水晶湖","ja":"クリスタルレイク","summary":"搜尋海藍寶石。需透過任務取得海藍寶石相關線索，再從湖區進入洞窟。","steps":["地圖技能：跳躍、礦石搜尋與採礦。","關聯事件：搜尋海藍寶石。","進入與探索：需透過任務取得海藍寶石相關線索，再從湖區進入洞窟。","2005實走：在湖中探索洞窟D與E時，通道機關曾因玩家忽略蒸氣位置而停住；注意蒸氣旁的岔路。","沿蒸氣旁轉角調查水晶開啟石門，擊敗內部頭目尋找水之海藍寶石。","水晶湖進洞口是湖面出現漣漪的位置；2005巴哈將洞窟分成A、B、C、D，水之命運石目標在D洞窟。","洞內石像會噴出石化煙霧；六座石像的房間留意左側不顯眼的通道，靠近水色結界前存檔。","水晶湖可先由水晶城街道或酒館情報開出；洞窟 D 的藍寶石路線至少要跳躍 Lv1。","建議跳躍 Lv2、寶箱搜尋 Lv2，隨機箱也會因任務與進度出現不同內容。","洞窟 D 的「アクアマリン」是固定劇情物品；其餘多數裝備與金錢寶箱不是每次全出現。"],"sources":["KYO-DUN-03","BH-MAP-SKILLS","PS2-ALISATO-2005","BH05-AQUAMARINE","KYO-OLD-FAQ","PS2-KYO-CRYSTAL"],"tags":["迷宮","地圖技能","クリスタルレイク","03","2005 PS2"],"stage":"羅薩利亞","risk":"2005巴哈稱最後頭目為大章魚、其他資料稱幽靈船；兩者可能指不同戰點，待PS2原版逐段確認，不斷言唯一BOSS。 ","砦跡","05","2005 PS2"],"stage":"騎士團領","risk":"未留夠隊伍空位可能使騎士團同行分支改變；落穴要「刻意跑」而非慢走。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/knight_abandoned.jpeg","caption":"砦跡｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_5_04.html","landmarks":[{"floor":"1F","type":"固定","item":"地圖、200金＋武器、500金＋Jewel","note":"先拿地圖，留意崩落地板。"},{"floor":"1F／B1","type":"機關","item":"P／Q／R／S 崩落地板","note":"十字鍵慢走不坍塌；在 P 點奔跑可抵地下。"},{"floor":"2F","type":"固定","item":"ガントレット、100金＋武器、100金＋Jewel","note":"另有一箱隨機金＋武器／防具。"},{"floor":"B1","type":"固定","item":"500金＋武器或Jewel","note":"需要寶箱搜尋能力。"},{"floor":"3F","type":"固定","item":"グレートソード、騎士の盾、シルバーマスク","note":"固定寶箱。"},{"floor":"3F","type":"機關","item":"○×△□ 四符號","note":"各符號需正確完成；失敗需重新計算，來源記載至少連續7次。"},{"floor":"全層","type":"隨機","item":"武器／防具／Jewel","note":"部分需要寶箱搜尋Lv1～4，不固定出現。"}],"imageHotspots":[{"x":83.8,"y":26.8,"label":"BOSS","detail":"原圖右上3F 的 BOSS 記號；同圖還有 1F 地板陷阱及 P→D 通道。","provenance":"https://kyokugen.info/minsaga/map/knight_abandoned.jpeg"}]},{"id":"D-05-02","section":"迷宮","title":"康斯坦茲","ja":"コンスタンツ","summary":"康斯坦茲遭綁架。經拜澤爾海姆的弗拉瑪取得線索才會開啟迷宮。","steps":["地圖技能：解除陷阱。","關聯事件：康斯坦茲遭綁架。","進入與探索：經拜澤爾海姆的弗拉瑪取得線索才會開啟迷宮。","2005玩家實走：特定房間把椅子推到地上的紅色圖樣即可開門。","救出康斯坦茲後回任務NPC報告；若玩家筆記顯示未完成，仍應實際查看洞窟及NPC是否還可觸發。"],"sources":["KYO-DUN-05","BH-MAP-SKILLS","PS2-ALISATO-2005","PS2-MAP-KNIGHT_CONSTANZU"],"tags":["迷宮","地圖技能","コンスタンツ","05","2005 PS2"],"stage":"騎士團領","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/knight_constanzu.jpeg","caption":"コンスタンツ｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_5_05.html","landmarks":[{"floor":"區域待核","type":"機關","item" 、100金＋呪印のスカーフ、霊花の首飾り，原站列為固定箱但須寶箱搜尋。","【第3階段頭目】來源特別提醒西南方的不定系頭目很容易漏看；先確認所有主線敵人再回村。","【判定】每次完成後記下現階段，不要拿第1階段圖去找第3階段的寶箱及門。"],"sources":["KYO-DUN-06-S","BH-MAP-SKILLS","PS2-MAP-VALHALLAND_SOUTH"],"tags":["迷宮","地圖技能","南の洞窟","06","2005 PS2"],"stage":"巴爾哈蘭特","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/valhalland_south.jpeg","caption":"南の洞窟｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_6_04.html","landmarks":[{"floor":"第1階段","type":"固定","item":"地圖、300金＋Jewel、翼のお守り","note":"最初的南之洞窟版本。"},{"floor":"第2階段","type":"固定","item":"上級傷藥、1600金＋バトルスタッフ","note":"高級傷薬可能爆炸陷阱。"},{"floor":"第3階段","type":"固定","item":"地圖、呪印のスカーフ、霊花の首飾り","note":"出發前跳躍Lv3且6次。"},{"floor":"第3階段","type":"頭目","item":"西南方不定系敵人","note":"容易漏打，仔細查原圖。"}]},{"id":"D-06-05","section":"迷宮","title":"凍結湖／冰凍城","ja":"凍結湖／凍りついた城","summary":"凍結湖妖精／冰封城。與110%進度條件有關，入城尋找黑曜石之劍。","steps":["地圖技能：寶箱搜尋、解除陷阱、開鎖。","關聯事件：凍結湖妖精／冰封城。","進入與探索：與110%進度條件有關，入城尋找黑曜石之劍。","2005巴哈實走：沙漠尼薩神殿與凍結湖妖精事件完成後，回凍結湖才有進入冰凍城的條件。","冰凍城：貼近燭台再離開可改變顏色，紅→綠→藍循環；五支蠟燭顏色一致會打開對應鐵柵。","部分路段須先切換成綠，再切換成紅或藍才能逐門通行；進入前先存檔，留意赤魔道士的後續對話。"],"sources":["KYO-DUN-06","BH-MAP-SKILLS","BH05-ICE","KYO-ICE-PUZZLE"],"tags":["迷宮","地圖技能","凍結湖／凍りついた城","06","2005 PS2"],"stage":"巴爾哈蘭特","risk":"冰凍城機關要五燭同色；取得黑曜石之劍後有後續分歧，不要不看對話直接交出。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/valhalland_frozen.jpeg","caption":"凍結湖／凍りついた城｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_6_06.html","landmarks":[{"floor":"區域待核","type":"機關","item":"地圖技能：寶箱搜尋、解除陷阱、開鎖。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-07-01","section":"迷宮","title":"梅爾維爾下水道","ja":"メルビル下水道","summary":"旅館女 東部可以透過寶箱搜尋 Lv1 找到錢與裝備。"],"sources":["KYO-DUN-09","BH-MAP-SKILLS","PS2-KYO-JUNGLE-DETAIL"],"tags":["迷宮","地圖技能","ジャングル","09","2005 PS2"],"stage":"瓦隆島","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/walon_jungle.jpeg","caption":"ジャングル｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_9_03.html","landmarks":[{"floor":"區域待核","type":"隨機","item":"中央部、洞窟 B/C 有地圖寶箱；洞窟 D 有 1000 金＋隨機武器的固定位置寶箱。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"區域待核","type":"隨機","item":"中央部與洞窟 B/C 有地圖；洞窟 D 固定有 1000 金＋隨機武器；東部可以透過寶箱搜尋 Lv1 找到錢與","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-09-03","section":"迷宮","title":"銀的洞窟","ja":"シルバーの洞窟","summary":"海賊銀的財寶。需從壁虎族事件取得情報；地圖技能等級門檻較高。","steps":["【入口觸發】到叢林深處東部，接近寶箱時背後才會顯示銀之洞窟入口。","【必備地圖能力】機關搜尋（仕掛けサーチ）Lv1至少1次；探索建議Lv3約3次、解除陷阱約20次、寶箱搜尋Lv5 1次、開鎖Lv1 1次。","【B1】固定地圖、1000金＋隨機武器；3000金＋シルバーハンマー需寶箱搜尋Lv5及開鎖，為重要高階獎勵。","【B2】固定隨機金、兩個100金＋Jewel箱；警報及遭遇型陷阱要先準備解除。","【B3】有數個金額500～2000的隨機箱，以及蟲アメの指輪、キレイ石の指輪等獎勵候選；某些箱會再生。","【B1～B3】拿完初期各箱後可能再刷出隨機金箱，不能把全部座標視為固定。","【事件】探索海賊希爾芭的財寶（海賊シルバーの財宝）時，隱藏牆比普通地形更重要；跟著原版地圖上的機關符號處理。"],"sources":["KYO-DUN-09","BH-MAP-SKILLS","KYO-MAP-ABILITY","KYO-OLD-FAQ","PS2-KYO-SILVER"],"tags":["迷宮","地圖技能","シルバーの洞窟","09","2005 PS2"],"stage":"瓦隆島","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/walon_silver.jpeg","caption":"シルバーの洞窟｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_9_06.html","landmarks":[{"floor":"入口","type":"機關","item":"隱藏牆：仕掛けサーチ Lv1","note":"從叢林東部進銀之洞窟。"},{"floor":"B1","type":"固定","item":"地圖、1000金＋隨機武器","note":"固定箱。"},{"floor":"B1","type":"固定","item":"3000金＋シルバーハンマー","note":"寶箱搜尋Lv5與開鎖。"},{"floor":"B2","type":"固定","item":"100金＋Jewel 等固定箱","note":"留意警報、遭遇陷阱。"},{"floor":"B3","type":"隨機","item":"飾品／500–2000金箱","note":"多組可能再生。"}]},{"id":"D-09-04","section":"迷宮","title":"雙月神殿","ja":"二つの月の神殿","summary":"皇帝的怪病／月亮石。2005日文舊攻略記載部分樓層要先擊倒史萊姆、不死系敵人才能通行，最深處面對Zodiac與月亮石。","steps":["2005年玩家實走：抵達B5後先前往B7迎戰「ゾディアック」取得「ムーンストーン」，再回B6挑戰「神獣」。","該玩家認為取得月亮石能恢復LP；此項屬個別觀察，需再核對。","事前配置寶箱搜尋、隱密與忍者步伐避免不必要的戰鬥。","2005巴哈中期攻略記載前四處門口：依次擊倒史萊姆系、蟲系、爬蟲系、不死系敵人啟動機關。","古文書線先蒐集アムトのシンボル與エリスのシンボル，兩者齊全才進神殿。","2005日記路線示例：可由B5轉往B7挑戰ゾディアック拿ムーンストーン，另一路通往B6神獣；路線順序依地圖判定。","2005原版巴哈：神殿前段需對特定敵群作戰開門，一樓史萊姆系、二樓蟲系、三樓爬蟲系、四樓不死系；高層的對應地圖樓層表需以原版確認。","【開啟神殿】完成古文書事件取得アムトのシンボル與エリスのシンボル，從叢林深處到雙月神殿。","【入口】先擊敗迷你翁・懷爾（ミニオン・ワイル），確認開門條件。","【B1】擊倒指定兩組不定系敵人，固定寶箱可取得霊獣石の腕輪。","【B2】指定的不死與不定系敵人組合會開啟体力の薬、プロテクトリング固定箱。","【B3】按敵種條件清除爬蟲系／不死系，回收霊獣石の具足、ガーディアンリング。","【B4】擊退昆蟲系等指定組合，回收霊獣石の兜、素早さの薬。","【B6】擊倒獸系神獸後可取得霊獣石の鎧；留意敵種與機關觸發關係。","【B7】到最深處處理ゾディアック戰，取得固定ムーンストーン。","【時限提醒】皇帝怪病支線有進度限制；神殿路線和寶箱請一次規劃完。"],"sources":["KYO-DUN-09","BH-MAP-SKILLS","PS2-DAI-TWIN","PS2-ALISATO-2005","BH05-MID1","BH05-ALBERT","BH05-CHAIN","EV-06","PS2-MAP-TWIN-MOONS"],"tags":["迷宮","地圖技能","二つの月の神殿","09","2005 PS2"],"stage":"瓦隆島","risk":"2005巴哈有「蟲／爬蟲」與現行日文攻略「昆蟲／蟲」分類用字差異；遊戲內以能開門的對應敵群確認。","quality":"依 2005 PS2 原版地圖舊資料逐層整理；原站可能有 Remastered 後續修訂，註明固定／隨機條件。","gallery":[{"src":"https://kyokugen.info/minsaga/map/walon_pyramid.jpeg","caption":"二つの月の神殿｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_9_07.html","landmarks":[{"floor":"B1","type":"機關","item":"不定系指定敵人組","note":"擊敗指定敵種啟動寶箱，地板條件依原圖。"},{"floor":"B1","type":"固定","item":"霊獣石の腕輪","note":"指定事件／敵種條件後取得。"},{"floor":"B2","type":"固定","item":"体力の薬、プロテクトリング","note":"不死系／不定系機關門檻。"},{"floor":"B3","type":"固定","item":"霊獣石の具足、ガーディアンリング","note":"需依敵種清除機關。"},{"floor":"B4","type":"固定","item":"霊獣石の兜、素早さの薬","note":"依樓層原圖走；混合特定敵種。"},{"floor":"B6","type":"固定","item":"霊獣石の鎧","note":"獸系指定神獸戰。"},{"floor":"B7","type":"頭目","item":"ゾディアック、ムーンストーン","note":"皇帝怪病支線，原版時限要留意。"}],"imageHotspots":[{"x":83.3,"y":65.6,"label":"BOSS","detail":"原圖右下鳥巢部標出 BOSS；雙月神殿末段頭目與ムーンストーン任務。","provenance":"https://kyokugen.info/minsaga/map/walon_pyramid.jpeg"}]},{"id":"D-10-01","section":"迷宮","title":"草原洞穴","ja":"草原～草原の穴","summary":"草原寶藏。由草原洞口進入；每層恐龍蛋可能依戰鬥勝利數決定是否出現。","steps":["入口：里高島草原→草原洞穴（草原の穴）。準備寶箱搜尋 Lv1，礦石搜尋及採掘依需求選帶。","草原本身可帶藥草搜尋、採取；洞穴內可找到隨機地圖、Jewel、牙之護符（牙のお守り）與魔獸之皮（魔獣の皮）等。","恐龍蛋並非保證每次出現；舊研究指出入樓層時的戰鬥勝利次數與出現位置相關，含連鎖戰鬥的分次計數。","有意刷恐龍蛋時不要只看地圖名稱，應逐層確認；本條不把變動寶箱當固定掉落。"],"sources":["KYO-DUN-10","BH-MAP-SKILLS","PS2-EICOS-CHEST","PS2-MAP-LIGAU_PLAIN"],"tags":["迷宮","地圖技能","草原～草原の穴","10","2005 PS2"],"stage":"里高島","risk":"恐龍蛋刷新涉及戰鬥勝利數與進入樓層時計算，不等同劇情進度百分比。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/ligau_plain.jpeg","caption":"草原～草原の穴｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_10_02.html"},{"id":"D-10-02","section":"迷宮","title":"恐龍洞穴","ja":"恐竜の穴","summary":"草原寶藏／恐龍蛋。草原洞穴及恐龍洞穴相關，須避免把兩個區域混成一張地圖。","steps":["地圖技能：尚待確認。","關聯事件：草原寶藏／恐龍蛋。","進入與探索：草原洞穴及恐龍洞穴相關，須避免把兩個區域混成一張地圖。"],"sources":["KYO-DUN-10","PS2-MAP-LIGAU_DINOSAURS"],"tags":["迷宮","地圖技能","恐竜の穴","10","2005 PS2"],"stage":"里高島","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/ligau_dinosaurs.jpeg","caption":"恐竜の穴｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_10_03.html"},{"id":"D-10-03","section":"迷宮","title":"財寶洞穴","ja":"財宝の穴","summary":"草原寶藏。2005 巴哈指出部分通路須使用高等級跳躍與攀爬。","steps":["入口：里高島草原→財寶洞穴（財宝の穴），出發前準備寶箱搜尋 Lv2、攀爬 Lv3、跳躍 Lv4。","B1：可取得 Jewel、隨機武器／防具及地圖寶箱；地圖已持有時內容可能改為金錢。","B2：有固定位置的隨機武器寶箱（附金錢）。","B3：注意生鏽古刀（さびた古刀）固定寶箱；格雷作為主角時關聯「刀の声」。另有 1000 金及 Jewel 等寶箱。","打倒寶箱附近的頭目後會有長弓相關寶箱；隨機寶箱可能再次出現，不應視為唯一固定物品。","注意：部分原版寶箱取法、是否重生與內容隨遊玩狀態而改變，非所有開箱都是固定結果。","寶箱實例：B1 可見 100 金＋隨機武器、200 金＋隨機防具；B2 有 300 金＋隨機武器。","B3 除古刀外，另可取得固定 1000 金與 500 金＋Jewel；擊倒頭目後可拿 500 金＋長弓。","格雷主角取得古刀的數量條件與其他主角不同，不要把重生隨機箱當成可無限拿古刀。","【草原入口】從傑爾頓進草原，南東方洞口跳入財寶洞穴（財宝の穴）。","【推薦地圖能力】寶箱搜尋 Lv2 4次、攀爬 Lv3 8次、跳躍 Lv4 2次；不足時至少分清主線與支線寶箱。","【B1】固定 Jewel、100 金＋隨機武器、200 金＋隨機防具，另有隨機箱與地圖。","【B2】固定 300 金＋隨機武器，探索不同分岔不要混淆 B1 的回程路線。","【B3 古刀】固定的さびた古刀在格雷「刀の声」路線尤其重要；另有 1000 金、500 金＋Jewel 固定箱。","【頭目獎勵】擊敗哥布林頭目後可開出 500 金＋長弓寶箱。","【隨機箱】B1～B3 的武器／防具與部分 200、300 金箱可能重生，寶箱搜尋條件與固定箱不同。","【注意】原版地圖上的星號與陷阱標記可查直接來源；不要將隨機箱畫成固定座標。"],"sources":["KYO-DUN-10","BH-MAP-SKILLS","BH05-KATANA","PS2-EICOS-CHEST","PS2-KYO-TREASURE"],"tags":["迷宮","地圖技能","財宝の穴","10","2005 PS2"],"stage":"里高島","risk":"地圖技能清單列的是全部探索所需技能，不一定每一條最短通路都強制。","quality":"依 2005 PS2 原版地圖舊資料逐層整理；原站可能有 Remastered 後續修訂，註明固定／隨機條件。","gallery":[{"src":"https://kyokugen.info/minsaga/map/ligau_treasure.jpeg","caption":"財宝の穴｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_10_04.html","landmarks":[{"floor":"B1","type":"固定","item":"Jewel、100金＋隨機武器、200金＋隨機防具","note":"寶箱內容中武器／防具類型隨機。"},{"floor":"B1","type":"隨機","item":"地圖","note":"格雷當主角時原站註明可能變成隨機金錢。"},{"floor":"B2","type":"固定","item":"300金＋隨機武器","note":"往地下2層，先辨認連通樓梯。"},{"floor":"B3","type":"固定","item":"1000金、500金＋Jewel","note":"固定回收清單。"},{"floor":"B3","type":"固定","item":"生鏽古刀（さびた古刀）","note":"格雷角色個人事件「刀の声」；務必先取。"},{"floor":"B3","type":"頭目後","item":"500金＋長弓","note":"擊敗頭目後才出現。"},{"floor":"B1–B3","type":"隨機","item":"隨機武器／防具／金錢","note":"可能重生，部分需寶箱搜尋Lv1或Lv2。"}],"imageHotspots":[{"x":30.2,"y":30.5,"label":"古刀","detail":"B3 圖中紅色星號＝さびた古刀（格雷「刀の声」任務）；來源原圖以此紅星標示。","provenance":"https://kyokugen.info/minsaga/map/ligau_treasure.jpeg"}]},{"id":"D-10-04","section":"迷宮","title":"托馬耶火山","ja":"トマエ火山","summary":"火山怪物／冰劍／火神防禦輪／冥府。通往四天王火焰暴君與冥府入口，需區分完成四天王條件與三地點的信仰條件。","steps":["【火山解鎖】傑爾頓受襲時在PUB取得「トマエ火山のモンスター」情報，或從吟遊詩人取得冥府線索。","【必須技能】跳躍Lv1至少9次；若要完整探索可準備約19次跳躍。","【選配】寶箱搜尋Lv2 1次、解除陷阱Lv3 1次，可帶礦石搜尋與挖掘。","【B1 固定箱】先拿地圖，再往下層進入危險火山地形。","【B3 固定箱】100金＋隨機防具或Jewel；300金＋隨機武器或Jewel。","【B3～B4 隨機箱】炎獣の皮可經寶箱搜尋Lv2遇到，帶警報陷阱，不保證每次出現。","【任務】火山與火神防禦輪、冰劍、冥府等事件相關，做任務選擇前分開存檔。"],"sources":["KYO-DUN-10","BH-MAP-SKILLS","PS2-ALISATO-2005","BH05-FIRE","BH05-FOUR","PS2-MAP-LIGAU_TOMAE"],"tags":["迷宮","地圖技能","トマエ火山","10","2005 PS2"],"stage":"里高島","risk":"冥府通道不等於直接能進冥府；先保留任務前存檔再選擇四天王交戰。","quality":"2026-10-17 逐項對照極限攻略原始地形圖與樓層寶箱表；來源站混含後期 Remastered 導覽，不採新版專屬系統。","gallery":[{"src":"https://kyokugen.info/minsaga/map/ligau_tomae.jpeg","caption":"トマエ火山｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","mapSourceUrl":"https://kyokugen.info/minsaga/minstrel_map_10_05.html","landmarks":[{"floor":"區域待核","type":"機關","item":"寶箱搜尋Lv2 1次、解除陷阱Lv3 1次，可帶礦石搜尋與挖掘。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B1","type":"攻略提示","item":"先拿地圖，再往下層進入危險火山地形。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B3","type":"隨機","item":"100金＋隨機防具或Jewel；300金＋隨機武器或Jewel。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B3","type":"機關","item":"炎獣の皮可經寶箱搜尋Lv2遇到，帶警報陷阱，不保證每次出現。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"D-10-05","section":"迷宮","title":"冥府","ja":"冥府","summary":"三地點之一：冥府。經托馬耶火山與火焰暴君交涉後前往死神處；同伴LP與選項後果須提示。","steps":["冥府（冥府）是三地點相關路線之一；先確認吟遊詩人提示及冥府開啟條件。","地圖表列必要跳躍 Lv0，約 12 次使用機會；別以為 Lv0 表示不需帶跳躍能力。","戰士之間、法官之間可遇到隨機金錢及地圖寶箱；取得既有地圖時，對應地圖寶箱會有替代內容。","找到死神（デス）後可能取得冥府地圖；對話與選擇攸關角色及事件，進入前建議另存進度。"],"sources":["KYO-DUN-10","BH-MAP-SKILLS","FFSKY-2005-LATE","PS2-MAP-UNDERWORLD"],"tags":["迷宮","地圖技能","冥府","10","2005 PS2"],"stage":"里高島","risk":"入口與地圖技能主要依2005巴哈清單／日文原版舊站，個別層數、寶箱與獎勵仍待全量複核。","quality":"2005原版歷史資料+迷宮頁，部分路線已驗證；尚未完成逐張地圖與任務關聯的完整驗收","gallery":[{"src":"https://kyokugen.info/minsaga/map/ligau_netherworld.jpeg","caption":"冥府｜2005 原版地圖作者實際攻略圖（寶箱、機關、樓層記號依圖說），外站圖片連線載入；不是本站自畫，不是遊戲內 3D 畫面擷取。"}],"mapType":"external_original_reference_image","map 的前期任務","時限イベント／期間限定","2005 PS2"],"stage":"0～40%","risk":"非所有角色皆有相同開場進度，部分事件因前置/連動而變化。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-003","section":"系統","title":"中期重要任務順序","ja":"皇帝の奇病／魔の島","summary":"先解皇帝怪病並拿月亮石，再到光之神殿聽魔之島訊息，避免後期錯失翡翠。","steps":["約40%可留意貓頭鷹、45%皇帝怪病；皇帝怪病約70%有失效風險。","古文書→兩種象徵→雙月神殿→ムーンストーン→交付皇帝。","再到梅爾維爾エロール神殿得知魔之島，於翡翠失效前上島；魔之島只能去一次。"],"sources":["PS2-SURUME-EVENT","BH05-MAGIC","BH05-MID1"],"tags":["中期重要任務順序","皇帝の奇病／魔の島","2005 PS2"],"stage":"40～95%","risk":"魔之島翡翠屬前置＋時限，不等於島嶼是否仍可進入。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-004","section":"系統","title":"高級財寶挖掘流程","ja":"お宝の地図／財宝サーチ／財宝発掘","summary":"藏寶圖不是一般寶箱：需帶財寶搜尋與發掘，並用藍色箭頭定位。","steps":["敵人偶爾掉「お宝の地図」，先確認地點與標示的搜尋等級。","配置「財宝サーチ」達藏寶圖等級，另帶「財宝発掘」，進入指定迷宮。","右下指南針出現藍色箭頭，走到區域後先財寶搜尋，再發掘。","若要嘗試不同財寶，鏡像研究者建議進入對應樓層前存檔；重新進出或時間差可能影響亂數。"],"sources":["PS2-ULTIMA-TREASURE","BH05-TREASURE"],"tags":["高級財寶挖掘流程","お宝の地図／財宝サーチ／財宝発掘","2005 PS2"],"stage":"地圖技能｜稀有裝備","risk":"地圖等級與稀有品機率屬玩家研究模型，並非官方保證掉落機率。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-005","section":"系統","title":"一輪三地點攻略注意事項","ja":"三拠点／最終試練／冥府／オールドキャッスル","summary":"最後三地點牽涉詩人情報、神的信仰與對話旗標；先取得目標情報、避免過早問出最終BOSS所在。","steps":["三地點：最終試練（最終試煉）、冥府、オールドキャッスル（古老之城）。","巴哈2005玩家建議先取得詩人對應情報，未確定三地都開啟前，勿急著向特定NPC問出沙魯因位置。","調整信仰時可能牽涉術法購買、加護與三柱陣，不直接採用單一玩家未驗證的精確點數公式。"],"sources":["BH05-THREE","PS2-SURUME-EVENT"],"tags":["一輪三地點攻略注意事項","三拠点／最終試練／冥府／オールドキャッスル","2005 PS2"],"stage":"100%前後","risk":"三地路線為2005玩家心得，非每周目保證同樣流程。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證；已移除自製圖案，依文字及遊戲來源查證。","gallery":[]},{"id":"PS2-GUIDE-006","section":"系統","title":"迷宮行前地圖技能檢查","ja":"マップアビリティ／ジャンプ／宝箱サーチ","summary":"打迷宮前先看需要的地圖能力，不是只看戰力；有些需要跳躍、開鎖、解除陷阱。","steps":["草原財寶穴完整探索：寶箱搜尋、礦石搜尋／採礦、跳躍Lv4、攀爬Lv3（2005巴哈清單）。","火山：跳躍Lv1、礦石搜尋／採礦、解除陷阱Lv3、寶箱搜尋Lv2。","魔之島：解除陷阱、開鎖、跳躍；一次性前往，更要事先配置。","進入後發現無法使用地圖能力時，先檢查技能是否配置在可使用欄位。"],"sources":["BH-MAP-SKILLS","BH05-MAGIC"],"tags":["迷宮行前地圖技能檢查","マップアビリティ／ジャンプ／宝箱サーチ","2005 PS2"],"stage":"探索準備","risk":"同地圖不同寶箱/支線要求不同，不代表全部都是必須技能。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-007","section":"系統","title":"原版與2022 Remastered 禁止混用清單","ja":"PS2版・リマスター版の相違","summary":"此站專收2005年PS2遊戲內本來就有的事件、角色與規則。","steps":["不採2022新增可操作角色／職業、額外強化頭目、便利倍速與新進度條。","PS2原版已經存在シェリル的事件、ダーク的跨周目事件，不能把整條舊任務誤排除。","資料若來自2022後改版的攻略站，一律以2005玩家記錄或明示PS2研究頁交叉核對。"],"sources":["PS2-SURUME-EVENT","NYUSUKE"],"tags":["原版與2022 Remastered 禁止混用清單","PS2版・リマスター版の相違","2005 PS2"],"stage":"資料判讀","risk":"","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-008","section":"系統","title":"日版PS2與北美版金手指不可混用","ja":"SLPM-65920／NTSC-J","summary":"2005日本版光碟編號SLPM-65920，巴哈歷史金手指碼需對應日版工具與主碼，不能套用北美版。","steps":["先確認實體光碟/模擬器的遊戲 ID 是否為SLPM-65920（日本版）。","若金手指工具使用不同格式，需先確認解碼格式與必須碼；不要同時啟用不同形式的主碼。","涉及戰鬥次數、敵人等級或事件旗標修改可能造成存檔或進度異常，先備份。"],"sources":["BH-CHEAT","PS2-ORIGINAL-FAQ-2005"],"tags":["日版PS2與北美版金手指不可混用","SLPM-65920／NTSC-J","2005 PS2"],"stage":"金手指準備","risk":"原碼來源為2005轉載資料；本專案尚未實機或模擬器驗證每條效果。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-009","section":"資料庫","title":"古刀取得與前三段鍛造","ja":"古刀／刀の声／青銅／ローザリア鋼／南方鉄","summary":"原版2005巴哈攻略：里高島財寶洞穴3F地面取得古刀，持續使用並依材料順序強化。","steps":["前往草原東部財寶洞穴3F，留意地板上的古刀。","取得古刀後先使用青銅補強，持續使用至刀升級，再回城市確認下一種材料。","前3段材料：青銅（傑爾頓）、ローザリア鋼（水晶城）、南方鉄（奧伊根施塔特）。","升級依使用鍛鍊，不必為進化刻意讓古刀損壞。"],"sources":["BH05-KATANA","BH-MAP-SKILLS"],"tags":["古刀取得與前三段鍛造","古刀／刀の声／青銅／ローザリア鋼／南方鉄","2005 PS2"],"stage":"武器強化","risk":"此條列出前期已核對鍛材；Lv4～Lv7後續材料暫不憑記憶杜撰。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-010","section":"資料庫","title":"五顆精靈珠出處速查","ja":"木／火／土／水／金の精霊珠","summary":"妖精森林原版任務要找木、火、土、水、金五顆精靈珠，分布不同迷宮。","steps":["木：迷途森林寶箱。","火：托馬耶火山B4、近火焰暴君房間前（帶跳躍）。","土：大坑（グレートピット）B5。","水：水龍神殿B3（帶跳躍，關乎水龍任務階段）。","金：其餘四顆取得後，向妖精森林指定妖精領取。"],"sources":["BH05-FAIRY"],"tags":["五顆精靈珠出處速查","木／火／土／水／金の精霊珠","2005 PS2"],"stage":"重要道具","risk":"水珠可能錯過，建議神殿階段同步調查；細節尚待第二個2005來源核對。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-011","section":"資料庫","title":"職業、術法、鍛造師在哪學？","ja":"クラス／術／鍛冶屋／マップアビリティ","summary":"2006年原版英文FAQ按地域整理師傅、魔法與鍛造師位置，適合查原版技能來源。","steps":["需要學習時先找英文FAQ的地區目錄：BAFAL、CORAL SEA、DRY LANDS、ROSALIA等。","對照本站11區地圖找相應城鎮；該表是PS2時代編寫，不含2022新增職業。","完整位置表較長，為尊重原作者先保留直接來源連結，暫不轉貼全文。"],"sources":["PS2-MENTOR-FAQ","PS2-ORIGINAL-FAQ-2005"],"tags":["職業、術法、鍛造師在哪學？","クラス／術／鍛冶屋／マップアビリティ","2005 PS2"],"stage":"技能／職業","risk":"","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-012","section":"資料庫","title":"角色成長率與敵人Rank","ja":"キャラクター成長率／モンスターランク","summary":"原版「war of side」研究站保存角色成長率、怪物Rank與稀有寶圖研究，數值是玩家資料不代表官方保證。","steps":["先開原作者鏡像站按「キャラクター成長率」與「モンスターランク」查項目。","不同角色的成長率與武器/術法養成可能有關，先作參考，不以單一表格斷言絕對上限。","原版攻略本的Rank和研究者的遊戲Rank可能不是同一個用法。"],"sources":["PS2-ULTIMA-WAR-ROOT","PS2-ULTIMA-TREASURE"],"tags":["角色成長率與敵人Rank","キャラクター成長率／モンスターランク","2005 PS2"],"stage":"資料研究","risk":"原站使用舊日文編碼，部分子頁可能亂碼；不可信內容暫不轉成確定數值。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-013","section":"資料庫","title":"邪教廢墟戰利品清單","ja":"邪教の廃墟／幻獣剣／羅刹の剛剣","summary":"提奧多爾後期迷宮：依現存地圖頁可取得幻獸劍、羅刹剛劍、666金等；有隨機寶箱。","steps":["先從提奧多爾房間取得廢墟地點，入場後依蠟燭/雕像機關判讀。","2F固定寶箱：666金、幻獣剣、地圖；3F包含羅刹の剛剣與3000金。","另有復活或隨機出現的武器、金錢；配置ワナ解除與宝箱サーチ較能收齊。"],"sources":["PS2-KYO-CULT","BH05-THEO"],"tags":["邪教廢墟戰利品清單","邪教の廃墟／幻獣剣／羅刹の剛剣","2005 PS2"],"stage":"迷宮寶箱","risk":"地圖站經過2022版面更新；列出的內容限2005原版已存在者。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-014","section":"資料庫","title":"魔之島進場四項準備","ja":"魔の島／ワナ解除／カギ開け／ジャンプ／エメラルド","summary":"魔之島僅一次出航，先檢查皇帝怪病、神殿情報、地圖技能及存檔。","steps":["已先完成皇帝の奇病（皇帝怪病）。","前往メルビルエロール神殿詢問魔の島情報。","於期限內在ヨービル搭船；帶陷阱解除、開鎖、跳躍，並保存出發前存檔。","進島依序關閉光球控制柱，塔頂擊敗ウェイ＝クビン，爭取翡翠。"],"sources":["BH05-MAGIC","PS2-KYO-MAGIC"],"tags":["魔之島進場四項準備","魔の島／ワナ解除／カギ開け／ジャンプ／エメラルド","2005 PS2"],"stage":"錯過風險","risk":"2005巴哈來源寫有期限限制，不完成條件就可能只看到BOSS逃跑。","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-GUIDE-015","section":"資料庫","title":"PS2 版原始出處索引使用規則","ja":"PS2攻略／史料照合／原版優先","summary":"巴哈全文403、舊站失效與後期改版內容不等於同一種狀態；要分清楚已證實、推測、僅歷史線索。","steps":["「已確認」=資料可讀、且可對到PS2時代來源。","「待核對」=僅單一玩家/後期綜合站或來源自行標示推測。","「403/404/503」=目前不能讀取，不表示網站歷史內容不存在。","所有日文名稱和繁中對照保留，來源頁面保留原網址與取得情況。"],"sources":["BH-INDEX","EICOS-LINK","PS2-OTAKARA-LINKHUB"],"tags":["PS2 版原始出處索引使用規則","PS2攻略／史料照合／原版優先","2005 PS2"],"stage":"網站資料維護","risk":"","quality":"已比對 2005 PS2 來源；非實機或所有可能路線驗證","gallery":[]},{"id":"PS2-ROUTE-016","section":"任務","title":"壁虎族→古文書→皇帝病｜連鎖流程","ja":"ゲッコ族／古文書／皇帝の奇病","summary":"先解壁虎族、取得古文書，才能在時限內進雙月神殿治好皇帝。","steps":["到ノースポイント酒館讓ゲラ＝ハ入隊，前往瓦隆島叢林的ゲッコ族洞窟。","洞內岩石推到光線處，先左光源再左下光源；跟族長談話後到ウェイプ武器屋查被囚者。","取得古文書後回梅爾維爾圖書館翻譯，去北艾斯塔米爾アムト神殿以及迷途森林神木拿兩枚象徵護符。","進度約45～未滿70%時取得皇帝病情報，進雙月神殿取得ムーンストーン，趕在期限前回梅爾維爾。"],"sources":["BH05-CHAIN","BH05-MID1","EV-06"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"45～未滿70%","risk":"皇帝病是時限事件；中間不要無限制戰鬥。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-ROUTE-017","section":"迷宮","title":"水龍神殿｜四玉與瀑布區先後","ja":"水竜の神殿／水竜の滝","summary":"錯過水龍瀑布與水之精靈珠前，先不要完成某些開門／討伐條件。","steps":["由馬拉爾湖的任務船抵達水龍神殿，帶跳躍Lv3、寶箱搜尋及開鎖／解陷。","分層取得水龍赤玉、綠玉、黃玉與青玉；開四玉門前先檢查瀑布區域。","如果妖精森林已點亮台座，地下3樓可取水之精靈珠，先完成再推進水龍劇情。","四玉裝置全啟動或打倒水龍，可能關閉瀑布通路；無法保證能再補拿。"],"sources":["KYO-WATER-PUZZLE","KYO-FAIRY-ORIG"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"水龍神殿","risk":"瀑布區關閉為重大可錯過條件。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[],"landmarks":[{"floor":"瀑布","type":"攻略提示","item":"分層取得水龍赤玉、綠玉、黃玉與青玉；開四玉門前先檢查瀑布區域。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"瀑布","type":"攻略提示","item":"四玉裝置全啟動或打倒水龍，可能關閉瀑布通路；無法保證能再補拿。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"PS2-ROUTE-018","section":"迷宮","title":"冰凍城｜五支蠟燭開門","ja":"凍った城／ロウソク","summary":"用角色移動讓五支蠟燭同色，反覆切換紅、綠、藍開對應門。","steps":["先完成凍結湖妖精前置，回到凍結湖進冰凍城。","靠近燭台再離開，火焰顏色按紅→綠→藍循環。","讓全部五支蠟燭顏色一致，對應顏色的鐵柵會打開；需要其他門時再切換整組顏色。","注意最後的黑曜石之劍與赤魔道士後續選項。"],"sources":["BH05-ICE","KYO-ICE-PUZZLE"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"凍結湖","risk":"機關後有劇情選項，建議分開存檔。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-ROUTE-019","section":"迷宮","title":"邪教廢墟｜六燭台隱藏門","ja":"邪教の廃墟／ロウソク","summary":"找齊六支燭台並點亮，就能等到入口側隱藏通道顯示。","steps":["提奧多爾失常事件取得便條後才能前往邪教廢墟。","走到有六支蠟燭的機關房，把六支都點亮。","等待入口方向左側牆面出現隱藏門，沿門後通道前進。","帶解除陷阱、寶箱搜尋，注意幻獣剣與羅刹の剛剣等固定裝備。"],"sources":["KYO-OLD-FAQ","PS2-KYO-CULT"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"騎士團領","risk":"別把燭台房當一般迷宮岔路一直繞。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[],"landmarks":[{"floor":"區域待核","type":"機關","item":"走到有六支蠟燭的機關房，把六支都點亮。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"區域待核","type":"機關","item":"帶解除陷阱、寶箱搜尋，注意幻獣剣與羅刹の剛剣等固定裝備。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"PS2-ROUTE-020","section":"迷宮","title":"銀之洞窟｜機關搜尋隱藏牆","ja":"シルバーの洞窟／仕掛けサーチ","summary":"地下一樓看似不能通行的牆，需要先裝備「仕掛けサーチ Lv1」。","steps":["透過壁虎族與海賊銀的財寶情報找到叢林洞窟。","出發前在城鎮設定仕掛けサーチ（機關搜尋）至少Lv1。","地下1樓調查隱藏牆並發動技能後才會開通路。","深入前先確認所有探索技能可用次數。"],"sources":["KYO-OLD-FAQ","KYO-MAP-ABILITY","BH05-SILVER"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"瓦隆島","risk":"沒技能不是遇到無解地形。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[],"landmarks":[{"floor":"區域待核","type":"機關","item":"出發前在城鎮設定仕掛けサーチ（機關搜尋）至少Lv1。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"區域待核","type":"機關","item":"地下1樓調查隱藏牆並發動技能後才會開通路。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"PS2-ROUTE-021","section":"迷宮","title":"水晶湖｜漣漪、石化氣與藍寶石","ja":"クリスタルレイク／アクアマリンの洞窟","summary":"尋找湖面漣漪、進D洞窟，小心石像石化煙霧。","steps":["取得水晶湖資訊後，注意水面漣漪可進入隱藏洞窟。","四洞窟中2005巴哈將目標標在D；帶ジャンプ前往深處。","六座石像房間的煙霧可能造成團滅，從左側較隱密的方向尋找水色結界。","不同舊攻略對頭目有大章魚／幽靈船等敘述，暫以「進入結界前存檔」為實用準備，不斷言頭目唯一種族。"],"sources":["BH05-AQUAMARINE","KYO-OLD-FAQ"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"水晶湖","risk":"頭目名稱存在文獻差異，待PS2實機交叉確認。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[],"landmarks":[{"floor":"區域待核","type":"頭目","item":"不同舊攻略對頭目有大章魚／幽靈船等敘述，暫以「進入結界前存檔」為實用準備，不斷言頭目唯一種族。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"PS2-ROUTE-022","section":"任務","title":"金庫襲擊｜金礦至梅爾維爾追賊","ja":"ゴールドマイン襲撃事件","summary":"初期金礦失竊的追捕線，不是後期金礦大規模怪物事件。","steps":["金礦無路人、金庫護衛倒地時進入金庫查案。","打退賊人派出的怪物後，到梅爾維爾地下水道追蹤海賊。","遇賊選戰鬥，通過後續房間查出幕後人物，至王宮領任務報酬。","2005玩家特別提醒盡量不要和旅館女兒／怪死任務交錯處理；來源為玩家經驗。"],"sources":["BH05-GOLD-VAULT","EV-03"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"15～未滿30%","risk":"限時；2005來源提示並行任務可能有bug，建議存檔。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-ROUTE-023","section":"任務","title":"四天王委託｜冰劍交換全鏈","ja":"アイスソード／火神防御輪／疾風の靴／あまぐもの腕輪","summary":"依賴取得與交付的順序，逐步從火焰暴君換到水龍報酬。","steps":["水龍要雨雲手鐲（あまぐもの腕輪）。","阿迪利斯要求疾風之靴（疾風の靴），拿回雨雲手鐲。","泰尼費澤要求火神防禦輪（火神防御輪），換得疾風之靴。","火焰暴君要求冰劍（アイスソード），交換火神防禦輪；反向交付回水龍。"],"sources":["BH05-FOUR","BH05-FIRE"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"四天王鏈","risk":"交換、戰鬥、種族調整分歧可能改變路線，不必一次全部打倒四天王。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-ROUTE-024","section":"任務","title":"人魚像｜マリーン與地下道","ja":"盗まれたニンフ像／マリーン","summary":"2005 PS2 原版已有マリーン任務，但她在原版不是2022追加的可招募同伴。","steps":["海港城鎮遇到マリーン的請求，調查寧芙像去向。","到金礦接護送持像男子任務，抵達梅爾維爾神殿後經歷夜間襲擊。","再到北艾斯塔米爾酒館取得線索，進地下道較深處處理後續。","不要套用Remastered版的マリーン招募流程。"],"sources":["BH05-NYMPH","KYO-EVENTS"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"沿海城鎮","risk":"PS2版本限定：只整理原版劇情，不含2022可加入隊伍設定。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-ROUTE-025","section":"系統","title":"地圖技能｜等級與可用次數如何計","ja":"マップアビリティ／仕掛けサーチ／ジャンプ","summary":"同隊技能取最高等級，使用次數加總；規劃時要同時看技能等級與次數。","steps":["在城鎮修練所設定地圖能力，不能等到進迷宮才隨意更換。","多名隊員持同一探索能力時，等級按全隊最高者；可用次數按持有者總和。","銀之洞窟需機關搜尋Lv1、水龍神殿妖精珠要跳躍Lv3、卡克拉姆寶藏洞穴需要更高攀爬與跳躍。","一般寶箱搜尋（宝箱サーチ）與寶圖挖掘（財宝サーチ／財宝発掘）是不同能力。"],"sources":["BH05-SHOPS","KYO-MAP-ABILITY"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"探索前","risk":"技能有等級與次數兩種門檻；別把Lv夠當成使用次數夠。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-ROUTE-026","section":"系統","title":"商店流通、武器補強修理","ja":"ショップ／武器補強／鍛冶屋","summary":"2005原版商店分流通通路；補強武器不能只靠旅館回復耐久。","steps":["同一經濟流通系統中的商店，隨玩家購買／販售會影響商店等級與庫存。","鍛造屋可調整武器模式及補強素材；某些適材能讓武器性能成長。","武器補強後不能靠普通住宿簡單恢復EP，需使用對應的鍛造／修理方式。","補強素材無法直接卸除，但可更換其他材料。"],"sources":["BH05-SHOPS","KYO-OLD-FAQ"],"tags":["2005 PS2原版","速查","日文／繁中"],"stage":"城鎮設施","risk":"商店供貨與EP因裝備種類而異，仍須依2005原版材料表對照。","quality":"已參照2005巴哈原文或2005原版資料，後期持續校對；未經PS2實機驗證","gallery":[]},{"id":"PS2-041-TREASURE-CAVE","section":"迷宮","title":"財寶洞穴 B1～B3 準備與固定寶箱","ja":"財宝の穴｜B1～B3 宝箱","summary":"里高島財寶洞穴實用清單：攀爬、跳躍、寶箱搜尋，以及生鏽古刀所在。","steps":["出發前：攀爬 Lv3、跳躍 Lv4、寶箱搜尋 Lv2。","B1：Jewel、地圖、隨機武器／防具；B2：金錢與武器。","B3：固定寶箱有「さびた古刀」（格雷主角與刀之聲相關）、1000 金；擊倒頭目後還有長弓寶箱。","隨機寶箱和其重生性別和固定寶箱混為一談。"],"sources":["KYO-DUN-10","PS2-EICOS-CHEST"],"tags":["財宝の穴","古刀","寶箱","里高島"],"stage":"里高島","risk":"部分寶箱可能為隨機重生","quality":"PS2 原版既有研究；非完整截圖地圖","gallery":[],"landmarks":[{"floor":"B1","type":"隨機","item":"B1：Jewel、地圖、隨機武器／防具；B2：金錢與武器。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"B3","type":"頭目","item":"B3：固定寶箱有「さびた古刀」（格雷主角與刀之聲相關）、1000 金；擊倒頭目後還有長弓寶箱。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"},{"floor":"區域待核","type":"隨機","item":"隨機寶箱和其重生性別和固定寶箱混為一談。","note":"依本站已有來源攻略文字歸類，未核對原始地圖精確座標。"}]},{"id":"PS2-041-DINOSAUR","section":"系統","title":"恐龍蛋出現條件速查","ja":"恐竜のたまご｜草原の穴","summary":"草原洞穴的恐龍蛋可能與入樓層當下的戰鬥勝利次數有關。","steps":["原版資料列示特定戰鬥勝利次數區間與樓層，並非所有路線與進度都會固定出現。","150～160：西南部；200～210：中央部1；250～260：中央部2。","330～340：東部；380～390：北部；430～440：東北部。","連鎖戰鬥可能依多次勝利計數；這是舊研究條件，尚未自行實機重新驗證。"],"sources":["KYO-DUN-10","PS2-EICOS-CHEST"],"tags":["恐竜のたまご","草原の穴","里高島"],"stage":"里高島","risk":"戰鬥勝利數與進樓層時機需留意","quality":"參考 PS2 地圖研究；仍須在原版實測；已移除自製圖案，依文字及遊戲來源查證。","gallery":[]},{"id":"PS2-041-REGION-TIPS","section":"系統","title":"迷宮探索前技能檢查","ja":"マップアビリティ｜宝箱サーチ・ジャンプ・クライミング","summary":"冒險前先查必要地圖能力，避免進迷宮後才發現無法跳躍、攀爬或解除陷阱。","steps":["財寶洞穴：寶箱搜尋 Lv2／攀爬 Lv3／跳躍 Lv4。","托馬艾火山：必要跳躍 Lv1；選配寶箱搜尋、陷阱解除與礦石採掘。","魔之島：建議準備跳躍 Lv1、開鎖、陷阱解除，且只能前往一次。","叢林：寶箱搜尋 Lv1，藥草搜尋與採取；入口可調整能力。","以上為按地圖研究整理的出發前提醒；不同遊戲進度會影響某些陷阱需求。"],"sources":["KYO-DUN-10","PS2-KYO-JUNGLE-DETAIL","PS2-KYO-MAGIC"],"tags":["マップアビリティ","探索","寶箱","陷阱"],"stage":"迷宮出發前","risk":"魔之島無法反覆前往","quality":"有來源對照；仍未逐迷宮實測","gallery":[]},{"id":"OFFLINE-042-01","section":"系統","title":"PS2 劇情進度／限時任務怎麼判斷","ja":"シナリオ進行度／ギユウ軍","summary":"2005 年 PS2 沒有 Remastered 的畫面進度圓環；利用各城鎮義勇軍教學對話和已開放任務推估進度。","steps":["劇情進度不是固定打幾場就增加；勝利後的隱藏進度點會依戰鬥強度等條件改變。","與義勇軍（ギユウ軍）交談，觀察最新增加的教學話題；該話題可用來對照原版事件發生表。","每一個限時任務要同時看「開始條件／結束條件／前置任務」，別把 2022 年的進度圓環圖示套到 PS2。","準備完成高風險事件前，先留存記錄；跨地區移動與關聯任務會影響事件刷新。"],"sources":["FAQ-EVENT","KYO-TIME-LIST"],"tags":["進度","ギユウ軍","義勇軍","事件限時"],"stage":"系統速查","risk":"百分比為攻略推估，不是 PS2 畫面可直接查看的數值。","quality":"原版 2005 Events FAQ 研究與原版事件列表交叉對照","gallery":[]},{"id":"STR-001","section":"打法","title":"新手前排防禦＋回復編成","ja":"初心者パーティ／防御・回復","summary":"2 前排＋1 中排＋2 後排的示例，強調可持續作戰。","steps":["前排 1：劍＋可配盾防具，專心保命、牽制；前排 2：大劍或斧系主攻。","中排：細劍／棍棒穩定輸出，並預留能對不同敵人改武器的位置。","後排 1：水術「癒しの水」負責救急；後排 2：弓／輔助術／地圖能力。","出門前檢查武器 EP、技能使用次數與旅館；新手不必追最高數值裝備。"],"sources":["PS2-KYO-BOSSES"],"tags":["2005 PS2","實戰","組隊","裝備","新手前排防禦＋回復編成"],"stage":"全周目","risk":"隊伍位置屬配置建議，實際隊員與可用術法依當前進度調整。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"示範配裝：前排防具優先防禦，後排避免把資金花在同一種類武器。"},{"id":"STR-002","section":"打法","title":"最終頭目｜沙魯因一階、二階打法","ja":"サルーイン／アニメート／ヴォーテクス","summary":"不獻或少獻命運石先熟悉流程；二階要留意全體攻擊與補血時機。","steps":["第一形態：維持全員 HP，避免倒下後被「アニメート」操控；誰血量低就先處理。","優先保留回復 BP，別把所有強力技在開場一輪用完。","第二形態：注意「心の闇」狀態異常、「ヴォーテクス」解除強化與「ゴッドハンド」高傷害。","若帶「リヴァイヴァ」可當保險，但遭魔法解除時會失效，不可只靠單一護盾。","第一次挑戰不要投入 10 顆命運石；原版獻石數會提高沙魯因難度。"],"sources":["PS2-KYO-BOSSES"],"tags":["2005 PS2","實戰","組隊","裝備","最終頭目","沙魯因一階、二階打法"],"stage":"全周目","risk":"獻石數、攻擊次數與目標 HP 依研究條件不同，實際戰況為準。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"建議：一名主補師＋可備援治療的第二人；前排物防裝與耐狀態裝交互搭配。"},{"id":"STR-003","section":"打法","title":"巴法爾金龍｜屬性吐息對策","ja":"ゴールドドラゴン／ブレス","summary":"金龍可能使用多種屬性吐息，先備好恢復與防禦。","steps":["挑戰前確認隊員的 HP、LP 與裝備，不建議帶著破損 EP 進場。","原版頭目研究提及從敵人背後接觸可能使戰局較有利。","避免全隊只帶同種物理抗性；保留能回復傷員的行動。","主攻手集中火力，支援位維持前列血線；若陷入長期消耗，回城提升防具。"],"sources":["PS2-KYO-BOSSES"],"tags":["2005 PS2","實戰","組隊","裝備","巴法爾金龍","屬性吐息對策"],"stage":"Boss","risk":"敵人HP與掉落物有隨機性；不將舊研究範圍寫成固定值。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"搭配：前排高防禦、後排遠程輸出，備好全隊緊急回復手段。"},{"id":"STR-004","section":"打法","title":"海盜布查｜先壓制大範圍攻擊","ja":"ブッチャー／ブレードロール","summary":"布查的刀刃旋轉是危險的全體攻擊，先保證續戰能力。","steps":["進戰鬥前將隊伍補滿 HP，避免剛開場遭範圍攻擊就失控。","可嘗試力量下降效果（STR 降低）及暈眩手段；舊攻略記載暈眩可能有效。","主攻手要集中火力，治療者適時救援，別把每回合都用在最高消耗技。","如果連續出現ブレードロール造成傷害過大，就先退回補防具與回復能力。"],"sources":["PS2-KYO-BOSSES"],"tags":["2005 PS2","實戰","組隊","裝備","海盜布查","先壓制大範圍攻擊"],"stage":"Boss","risk":"降能力、暈眩是否成功仍會受敵方行動與狀態影響。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"搭配：前排防禦＋能給予 STR 下降效果的術／技＋至少 1 名補師。"},{"id":"STR-005","section":"打法","title":"開拓村早期任務｜避免錯過","ja":"開拓村の誘拐事件／ヤシの洞窟","summary":"開局先處理，避免冒險進度推到任務失效。","steps":["從亞西開拓村取得誘拐事件消息，確認洞窟開啟條件。","在事件尚有效時進雅西洞窟，依實際地形圖找深層與事件敵。","優先解事件，再回收非必要的探索箱，避免因刷怪使事件進度前進。","返回村落完成交差，保留不同階段存檔供錯過時回溯。"],"sources":["PS2-KYO-BOSSES","EV-01","KYO-TIME-LIST"],"tags":["2005 PS2","實戰","組隊","裝備","開拓村早期任務","避免錯過"],"stage":"事件","risk":"部分事件開啟及結束點隨主角、進度刷新而變。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"搭配：有補血術、使用次數充足的寶箱搜尋，武器 EP 別過低。"},{"id":"STR-006","section":"打法","title":"皇帝怪病｜雙月神殿出發前","ja":"皇帝の奇病／二つの月の神殿","summary":"先準備神殿鑰匙與探索能力，避免在時間限制內折返。","steps":["先取得アムトのシンボル與エリスのシンボル；確認可進神殿。","切換本站雙月神殿迷宮圖，依樓層處理特定敵種才能發動地板機關。","王宮相關事件有時限，不要反覆刷怪後才回頭跑神殿。","到最深處應戰ゾディアック之前存檔，取得ムーンストーン後處理回報。"],"sources":["PS2-KYO-BOSSES","KYO-DUN-09","BH-MAP-SKILLS"],"tags":["2005 PS2","實戰","組隊","裝備","皇帝怪病","雙月神殿出發前"],"stage":"事件","risk":"神殿圖為重新整理的地形輪廓；寶箱中隨機內容不保證每次相同。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"搭配：高防禦前衛、穩定回復、適當法術防護；帶足探索技能。"},{"id":"STR-007","section":"打法","title":"水龍神殿｜瀑布區先拿再開門","ja":"水竜の神殿／水竜の滝","summary":"瀑布與四玉的行動先後會影響可探索區域。","steps":["進神殿前帶ジャンプ Lv3、寶箱搜尋、開鎖與解除陷阱。","先完整探索滝區與需要的物品，再回到四顆水龍玉的開門條件。","裝好四玉、或直接擊倒水龍後，滝區的可通行條件可能改變。","妖精森林相關的水之精靈珠也要一併安排，免得日後再來才發現不能走。"],"sources":["PS2-KYO-BOSSES","KYO-DUN-02","BH-MAP-SKILLS"],"tags":["2005 PS2","實戰","組隊","裝備","水龍神殿","瀑布區先拿再開門"],"stage":"事件","risk":"順序依原版地圖研究，建議重要抉擇前分開存檔。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"搭配：至少一人負責地圖技能，另有補師與穩定物理輸出。"},{"id":"STR-008","section":"配裝","title":"武器使用／EP 補強｜開局裝備組合","ja":"武器補強／鍛冶屋／EP","summary":"重點不是一味買最高攻擊，而是 EP 消耗與補強材料取得。","steps":["主攻手挑符合已學技能的武器類型，先看基本威力與模式是否合適。","支援者優先提高存活能力，並準備能回復 HP 的術或藥物。","補強素材與鍛造可能改變強度、耐久與 EP 消耗，不等於旅館住宿就能完全回復。","遇到高消耗技時，可更換低成本技清怪，將大招留給頭目。"],"sources":["PS2-KYO-BOSSES"],"tags":["2005 PS2","實戰","組隊","裝備","武器使用／EP 補強","開局裝備組合"],"stage":"鍛造","risk":"原版武器鍛造機制較複雜，材料適性與精確數值依個別武器而異。","quality":"以2005 PS2原版系統與原版既有頭目攻略改寫；隊伍搭配為本站非唯一方案","loadout":"搭配：長劍前衛＋弓後衛＋水術補師；武器與職業需配合技能清單。"}],"excluded":["2022 Remastered 五位追加角色：モニカ／マリーン／フラーマ／シェリル／アルドラ","2022 Remastered 新增終極頭目「極サルーイン」與「究極のヒミツ」","Remastered 倍速、可視化進度條、煙玉、全套 NEW GAME+ 角色／裝備／能力繼承","Remastered 追加裝備、追加職業、2022 年後專屬金手指","2022 Remastered 新增可操作角色、功能、Boss、裝備、進度條與加速功能；PS2 日本版SLPM-65920以外金手指碼不得混用。"]}</script>
<script>(()=>{'use strict';const data=JSON.parse(document.getElementById('offline-data').textContent);
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const R=data.records,S=Object.fromEntries(data.sources.map(s=>[s.id,s]));const cats=['全部','新手','主角','地圖','迷宮','任務','打法','配裝','資料庫','系統','金手指'];let section='全部',q='',limit=18;
const tabs=document.getElementById('tabs'),cards=document.getElementById('cards'),search=document.getElementById('search'),count=document.getElementById('count'),more=document.getElementById('more');
for(const c of cats){const b=document.createElement('button');b.type='button';b.className='tab';b.textContent=c==='地圖'?'區域索引':c==='資料庫'?'裝備資料':c;b.setAttribute('aria-pressed',c===section?'true':'false');b.addEventListener('click',()=>{section=c;limit=18;for(const x of tabs.children)x.setAttribute('aria-pressed',x===b?'true':'false');render()});tabs.append(b)}
search.addEventListener('input',()=>{q=search.value.trim().toLowerCase();limit=18;render()});
function card(r){
 const parts=['<article class="card"><h2>',esc(r.title),'</h2><div lang="ja" class="ja">',esc(r.ja),'</div><div class="meta">',esc(r.section),' · ',esc(r.stage||''),'</div><p class="summary">',esc(r.summary||''),'</p>'];
 if(r.steps?.length)parts.push('<h3>攻略步驟</h3><ol class="steps">',r.steps.filter(x=>!/^https?:/.test(x)).map(t=>'<li>'+esc(t)+'</li>').join(''),'</ol>');
 if(r.landmarks?.length){parts.push('<section class="markers"><h3>寶箱／機關／頭目 · ',r.landmarks.length,'項</h3>');for(const m of r.landmarks)parts.push('<div class="marker"><b>',esc(m.floor),'</b><b>',esc(m.type),'</b><span>',esc(m.item),' — ',esc(m.note),'</span></div>');parts.push('</section>')}
 if(r.imageHotspots?.length)parts.push('<p class="meta">已查實的原圖點位文字：',r.imageHotspots.map(h=>esc(h.label+'：'+h.detail)).join('、'),'</p>');
 if(r.heroChapters?.length){parts.push('<div class="chapters"><h3>五章周目路線</h3>');for(const ch of r.heroChapters){parts.push('<div class="chapter"><b>',esc(ch.title),'</b><p>',esc(ch.description),'</p>');for(const id of ch.ids){const target=R.find(x=>x.id===id);if(target)parts.push('<button type="button" class="chip" data-title="',esc(target.title),'">',esc(target.title),'</button>')}parts.push('</div>')}parts.push('</div>')}
 if(r.risk)parts.push('<p class="meta">注意：',esc(r.risk),'</p>');
 parts.push('<p class="source">出處：',esc((r.sources||[]).map(id=>S[id]?.name||id).join('、')),'。',esc(r.quality||''),'</p></article>');
 return parts.join('');
}
function render(){let list=R.filter(r=>(section==='全部'||r.section===section)&&(!q||[r.title,r.ja,r.summary,r.stage,r.risk,(r.steps||[]).join(' '),JSON.stringify(r.landmarks||[])].join(' ').toLowerCase().includes(q)));cards.innerHTML=list.slice(0,limit).map(card).join('')||'<p>無符合資料，試試日文名稱。</p>';count.textContent='顯示 '+Math.min(limit,list.length)+'／'+list.length+' 筆；本單檔完整收錄 '+R.length+' 筆';more.style.display=list.length>limit?'block':'none'}
more.addEventListener('click',()=>{limit+=18;render()});
cards.addEventListener('click',e=>{const btn=e.target.closest('[data-title]');if(btn){section='全部';q=btn.dataset.title.toLowerCase();search.value=btn.dataset.title;for(const b of tabs.children)b.setAttribute('aria-pressed',b.textContent==='全部'?'true':'false');render();search.scrollIntoView({behavior:'smooth'})}});
render();})();
</script></body></html>
