<text x="1117" y="359" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" fill="#292323">依原版通道與房間方位重新描出</text>
<circle cx="1095" cy="421" r="7" fill="#a56b3c"/>
<text x="1117" y="430" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" fill="#292323">此區有橋、死亡之門、法官之間等分區</text>
<circle cx="1095" cy="492" r="7" fill="#a56b3c"/>
<text x="1117" y="501" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" fill="#292323">途中需要跳躍能力，進入前確認回程路線</text>
<circle cx="1095" cy="563" r="7" fill="#a56b3c"/>
<text x="1117" y="572" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" fill="#292323">原版攻略地圖有隨機寶箱，位置不能全部當</text>
<text x="1117" y="611" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="25" fill="#292323">固定點</text>
