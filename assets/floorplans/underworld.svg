<text x="1078" y="882" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" fill="#806b64">地圖呈現：本站獨立重繪</text>
<text x="1078" y="922" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" fill="#806b64">通道相對位置依 PS2 原版資料</text>
<text x="1078" y="962" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" fill="#806b64">不是一般流程框／資訊卡</text>
<text x="1078" y="1002" font-family="Noto Sans CJK TC, Noto Sans, Microsoft JhengHei, PingFang TC, sans-serif" font-size="22" fill="#806b64">部分寶箱為隨機生成，未標固定點</text>
