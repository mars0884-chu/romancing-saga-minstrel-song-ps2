<text x="1104" y="572" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">地圖技能：跳躍、攀爬。</text>
<circle cx="1083" cy="622" r="6" fill="#a56b3c"/>
<text x="1104" y="632" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">關聯事件：寶石獸／邊境地區毀滅。</text>
