<text x="1104" y="380" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">開放進度：乾燥地帶</text>
<circle cx="1083" cy="430" r="6" fill="#a56b3c"/>
<text x="1104" y="440" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">三地點之一：古老之城。烏索聽完線索進入</text>
<text x="1104" y="476" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">古城；調整三座龍頭機關開門，擊敗三名守</text>
<text x="1104" y="512" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">衛後由井底通往巨人村。</text>
<circle cx="1083" cy="562" r="6" fill="#a56b3c"/>
<text x="1104" y="572" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">地圖技能：藥草搜尋、採集。</text>
<circle cx="1083" cy="622" r="6" fill="#a56b3c"/>
<text x="1104" y="632" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#292323">關聯事件：三地點之一：古老之城。</text>
