name: Deploy Remastered PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Test responsive offline PWA and guide indexes
        run: python tools/test_pwa.py
      - name: Test multi-file downloadable offline ZIP integrity
        run: python tools/build_offline_zip.py
      - name: Test extracted ZIP while disconnected (desktop and mobile)
        run: python tools/test_offline_zip.py
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build multi-file offline ZIP for GitHub Pages
        run: python tools/build_offline_zip.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify LIVE GitHub Pages HTML, PWA, and synchronized guide version
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Live Pages URL: ${LIVE_URL}"
          if [[ -z "${LIVE_URL}" || "${LIVE_URL}" != https://* ]]; then
            echo "::error::No valid https Pages URL was returned"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --location --max-time 20 --silent --show-error "${LIVE_URL%/}/index.html?sha=${GITHUB_SHA}" -o /tmp/minstrel-live-index.html \
              && curl --fail --location --max-time 20 --silent --show-error "${LIVE_URL%/}/sw.js?sha=${GITHUB_SHA}" -o /tmp/minstrel-live-sw.js \
              && curl --fail --location --max-time 20 --silent --show-error "${LIVE_URL%/}/data.json?sha=${GITHUB_SHA}" -o /tmp/minstrel-live-data.json \
              && python -c 'import json,pathlib; p=pathlib.Path; local=json.loads(p("data.json").read_text(encoding="utf-8")); live=json.loads(p("/tmp/minstrel-live-data.json").read_text(encoding="utf-8")); assert live==local, "published data.json differs from commit"; token="minstrel-ps2-2005-v"+local["version"].split("-",1)[0]; assert token in p("/tmp/minstrel-live-index.html").read_text(encoding="utf-8"), "homepage version mismatch"; assert token in p("/tmp/minstrel-live-sw.js").read_text(encoding="utf-8"), "SW version mismatch"; print("LIVE DEPLOY VERIFIED:",token,"records:",len(live["records"]))'; then
              echo "LIVE DEPLOY VERIFIED: public HTML, SW and guide JSON match this commit"
              exit 0
            fi
            echo "Live Pages not propagated (attempt ${attempt}/12); retry in 10 seconds."
            sleep 10
          done
          echo "::error::Public Pages version mismatch or network error after 12 attempts"
          exit 1

      - name: Verify LIVE downloadable offline ZIP
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl --fail --location --max-time 35 --silent --show-error "${LIVE_URL%/}/offline-guide.zip?sha=${GITHUB_SHA}" -o /tmp/minstrel-offline-guide.zip \
              && python - <<'PY'
          from zipfile import ZipFile
          import json
          with ZipFile('/tmp/minstrel-offline-guide.zip') as z:
              assert z.testzip() is None
              names=z.namelist()
              assert sum(x.startswith('minstrel-song-offline/assets/') for x in names)>=100
              data=json.loads(z.read('minstrel-song-offline/data.json'))
              assert len(data['records'])>=279
          print('LIVE offline ZIP VERIFIED',len(data['records']),'records',len(names),'packaged files')
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public Pages offline-guide.zip missing or invalid"
          exit 1
