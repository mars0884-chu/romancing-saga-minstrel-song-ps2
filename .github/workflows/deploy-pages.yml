name: Deploy Remastered PWA to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Test responsive offline PWA and guide indexes
        run: python tools/test_pwa.py
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify LIVE GitHub Pages HTML, PWA, and synchronized guide version
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Live Pages URL: ${LIVE_URL}"
          if [[ -z "${LIVE_URL}" || "${LIVE_URL}" != https://* ]]; then
            echo "::error::No valid https Pages URL was returned"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            if curl --fail --location --max-time 20 --silent --show-error "${LIVE_URL%/}/index.html?sha=${GITHUB_SHA}" -o /tmp/minstrel-live-index.html \
              && curl --fail --location --max-time 20 --silent --show-error "${LIVE_URL%/}/sw.js?sha=${GITHUB_SHA}" -o /tmp/minstrel-live-sw.js \
              && curl --fail --location --max-time 20 --silent --show-error "${LIVE_URL%/}/data.json?sha=${GITHUB_SHA}" -o /tmp/minstrel-live-data.json \
              && grep -q "minstrel-ps2-2005-v0.9.1" /tmp/minstrel-live-index.html \
              && grep -q "minstrel-ps2-2005-v0.9.1" /tmp/minstrel-live-sw.js \
              && python -c 'import json;d=json.load(open("/tmp/minstrel-live-data.json"));assert d["version"].startswith("0.9.1"),d["version"];assert len(d["records"])>=263;print("Live guide records:",len(d["records"]))'; then
              echo "LIVE DEPLOY VERIFIED: public HTML, SW and guide JSON are v0.9.1"
              exit 0
            fi
            echo "Live Pages not propagated (attempt ${attempt}/12); retry in 10 seconds."
            sleep 10
          done
          echo "::error::Public Pages version mismatch or network error after 12 attempts"
          exit 1
