name: Verify 2005 PS2 PWA offline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium & test dependencies
        run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Test installed PWA offline, desktop & mobile layouts
        run: python tools/test_pwa.py