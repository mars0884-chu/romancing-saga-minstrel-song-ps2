name: Import PS2 2005 cover for PWA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-ps2-cover.yml', 'tools/import_ps2_cover.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-original-2005-ps2-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - run: python tools/import_ps2_cover.py
      - name: Verify and commit original PS2 cover assets
        shell: bash
        run: |
          test -s assets/icon-192.png && test -s assets/icon-512.png && test -s assets/apple-touch-icon.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon-192.png assets/icon-512.png assets/apple-touch-icon.png assets/ps2-original-cover.webp assets/COVER_SOURCE.txt
          git diff --cached --quiet && exit 0
          git commit -m "Use 2005 PS2 original cover for homepage and PWA icons"
          git push