name: Audit Original Map Image URLs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - name: Check image response and actual dimensions without rehosting
        run: python tools/audit_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: map-and-portrait-image-audit
          path: image-audit.json
          retention-days: 30
